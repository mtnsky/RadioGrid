<!-- V15: scaled 1:1-ratio preview, iOS-style grouped editor and button text color -->
<style>
  :root {

    --danger:#ff6961; --tab-r:16px; --card-r:13px;
    --card-width:100%; --card-outline-color:#777b83; --card-outline-width:1px;
    --card-gap-x:10px; --card-gap-y:10px;
    --app-font:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
    --title-font-size:32px; --title-font-weight:800; --title-font-style:normal;

  *,*::before,*::after { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

    margin:0; height:100dvh; overflow:hidden; color:var(--text);
    font-family:var(--app-font);

    background:radial-gradient(ellipse at 50% -30%, rgba(255,255,255,.06),transparent 56%),var(--bg);
  }
  [hidden] { display:none !important; }
  button,input,select { font:inherit; }
  button { cursor:pointer; color:inherit; border:0; -webkit-appearance:none; appearance:none; }
  button:focus-visible,input:focus-visible,select:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  /* Full-height app with one scrollable content region only when absolutely necessary. */
  .app { margin:auto; width:min(100%,760px); height:100dvh; display:flex; flex-direction:column; min-height:0;
    padding:max(8px,env(safe-area-inset-top)) 14px max(12px,env(safe-area-inset-bottom)); overflow:hidden; }
   .header { position:relative; flex:0 0 auto; display:flex; flex-direction:column;
    align-items:center; justify-content:center; height:76px; padding:4px 56px 7px; }
  .app-title { font-size:var(--title-font-size); font-weight:var(--title-font-weight); font-style:var(--title-font-style); line-height:1.08; letter-spacing:-.045em; margin:0; max-width:100%; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .subtitle { color:var(--muted); margin-top:8px; font-size:clamp(13px,3.4vw,18px); font-weight:480; letter-spacing:-.012em; white-space:nowrap; }
  .menu { position:absolute; right:0; top:50%; transform:translateY(-50%); width:48px; height:48px; display:grid; place-items:center; color:var(--accent); border-radius:15px; border:1px solid var(--line); background:linear-gradient(155deg,#25282d,#17191d); }
  .menu:active { filter:brightness(1.3); transform:translateY(-50%) scale(.97); }
  .menu svg { width:27px; height:27px; }
  /* Fixed, unscrollable category bar. Font is automatically fit to one line. */
  .tabs { flex:0 0 auto; display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:0;
    border-bottom:1px solid rgba(255,255,255,.11); margin:0 -14px 12px; padding:0 14px;
    overflow-x:hidden; touch-action:manipulation; }
  .tabs::-webkit-scrollbar { display:none; }
   .tab { min-width:0; position:relative; display:flex; flex-direction:column; align-items:center;
    justify-content:center; padding:13px 2px 15px; color:#a5aab2; background:transparent;
    font-size:15px; font-weight:700; text-align:center;
    white-space:nowrap; touch-action:manipulation; }
  .tab span { display:block; max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:clip; letter-spacing:-.025em; }
  .tab svg { display:none; }
  .tab.active { color:var(--accent); }
  .tab.active::after { content:""; position:absolute; bottom:0; left:8%; right:8%; height:4px; border-radius:6px 6px 0 0; background:var(--accent); }
  .tab:active { background:rgba(255,255,255,.035); }
  /* Full-width page strip tracks a finger drag and springs into place. */
  .page-track { width:100%; height:100%; display:flex; align-items:stretch;
    transform:translate3d(0,0,0); will-change:transform;
    transition:transform .34s cubic-bezier(.22,1,.36,1); }
  .page-slide { flex:0 0 100%; min-width:0; height:100%; overflow:hidden;
    touch-action:pan-y; overscroll-behavior-y:contain; -webkit-overflow-scrolling:touch; }
  .grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr));
    grid-auto-rows:var(--card-height,96px);
    column-gap:var(--card-gap-x); row-gap:var(--card-gap-y); align-content:start; }
  /* Uniform graphite text-only tiles, no illustrated icons */
  .card { min-width:0; width:var(--card-width); justify-self:center; height:100%; position:relative;
    display:flex; align-items:center; justify-content:center; text-align:center;
    padding:8px 8px; border-radius:var(--card-r);
    background:var(--card);
    border:var(--card-outline-width) solid var(--card-outline-color);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.08), 0 8px 20px rgba(0,0,0,.24);
    touch-action:pan-y; transition:transform .08s,filter .08s; }
  .card:active { transform:scale(.963); filter:brightness(1.18); }
  /* One shared font size for every button, including radio frequency and station name. */
  .card-label { min-width:0; max-height:100%; font-size:var(--button-font-size); font-weight:var(--button-font-weight); font-style:var(--button-font-style);
    line-height:1.14; letter-spacing:-.022em; color:var(--card-text); overflow-wrap:normal; word-break:normal;
    display:block; width:100%; }
  .card-label .frequency, .card-label .callsign { display:block; font:inherit; line-height:1.14; }
  .card-label .callsign { margin-top:3px; }
  .page-viewport { flex:1 1 auto; min-height:0; overflow:hidden;
    touch-action:pan-y; overscroll-behavior:contain; }
  .grid-empty { color:var(--muted); padding:18px 4px; grid-column:1/-1; text-align:center; }
  .section-note { margin:15px 4px; color:#888e99; text-align:center; font-size:12px; }

/* V16 – native grouped-list presentation */
.card-label{font-family:var(--button-font,var(--app-font));}
:root { --title-color:#f6f6f7; --pattern-image:none; --pattern-size:auto; --pattern-opacity:0; }
body { background:var(--bg); }
.app { position:relative; isolation:isolate; }
.app::before { content:""; position:absolute; inset:0; background-image:var(--pattern-image);background-size:var(--pattern-size);opacity:var(--pattern-opacity);pointer-events:none;z-index:0; }
.app > * { position:relative;z-index:1; }
.app-title { color:var(--title-color); }
.header { padding-left:66px; padding-right:66px; }
.header-action { position:absolute;top:50%;transform:translateY(-50%);height:46px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:14px;background:#22252a;color:var(--accent); }
.edit-home { left:0;min-width:61px;padding:0 12px;font-weight:700;font-size:16px; }
.menu {right:0;width:46px;height:46px;}

.header-action:active { filter:brightness(1.25); }

.sheet{position:fixed;z-index:21;left:50%;bottom:0;transform:translate(-50%,105%);visibility:hidden;display:flex;flex-direction:column;width:min(100%,660px);height:min(94dvh,920px);max-height:94dvh;border-radius:24px 24px 0 0;background:#1b1c20;border:1px solid rgba(255,255,255,.10);border-bottom:0;box-shadow:0 -18px 60px #0009;transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility .28s;padding-bottom:env(safe-area-inset-bottom)}
.sheet.open{transform:translate(-50%,0);visibility:visible}

.settings-preview{flex:none;padding:8px 12px 10px;border-bottom:1px solid #ffffff10;background:#202127}
.settings-preview[hidden]{display:none!important}
.preview-caption{display:flex;align-items:center;justify-content:space-between;color:#9498a1;letter-spacing:.06em;font-size:10px;font-weight:650;padding:0 5px 5px;text-transform:uppercase}
.preview-stage{border:1px solid #ffffff15;border-radius:12px;background:#090a0b;display:flex;justify-content:center;overflow:hidden;padding:7px 0}
.preview-mini{position:relative;isolation:isolate;transform-origin:top left;flex:none;padding:9px 14px 6px;overflow:hidden;background:var(--bg)}
.preview-mini::before{content:"";position:absolute;inset:0;background-image:var(--pattern-image);background-size:var(--pattern-size);opacity:var(--pattern-opacity);z-index:0;pointer-events:none}
.preview-mini>*{position:relative;z-index:1}

.preview-mini .card{pointer-events:none}
/* Grouped Settings list system */
.ios-group-title{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.045em;color:#9799a2;margin:22px 10px 7px}
.ios-group-title:first-child{margin-top:2px}
.ios-group{border-radius:13px;background:#2c2c2e;overflow:hidden}

.ios-row:last-child{border-bottom:0}
.ios-row-label{font-size:15px;font-weight:500;color:#f4f4f6;flex:0 0 112px}
.ios-row-value{min-width:0;flex:1;display:flex;align-items:center;justify-content:flex-end;gap:10px}
.ios-row-value>input[type=text],.ios-row-value>select{width:100%;min-width:0;text-align:right;background:transparent;border:0;padding:7px 0;color:#e9e9ed;outline:none;font-size:16px}

.ios-value{min-width:39px;color:#aaaeb7;font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.ios-help{margin:8px 10px 14px;color:#9a9da7;font-size:12px;line-height:1.45}

.ios-segments button.selected{background:#505059;color:white;box-shadow:0 1px 3px #0008}
.ios-button{width:100%;min-height:46px;background:var(--accent);color:#1b1c20;border-radius:12px;font-weight:700;margin:12px 0}
.ios-choice-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:2px 0 5px}
.ios-pattern{display:flex;flex-direction:column;gap:6px;align-items:center;padding:9px 5px 8px;border:1px solid #ffffff20;border-radius:12px;background:#2c2c2e;color:#d5d6da;font-size:11px}

.pattern-sample{width:100%;height:35px;border-radius:7px;border:1px solid #ffffff24;background-color:var(--bg);background-image:var(--chip-image);background-size:var(--chip-size);opacity:.95}
@media(max-width:365px){.ios-row-label{flex-basis:90px}.ios-row{padding:9px 10px}.ios-row-value{gap:6px}.ios-value{min-width:31px;font-size:11px}.organize-count{display:none}.org-btn{width:25px;min-width:25px}}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

  {id:"radio",name:"Radio"}

 for(const {id,name} of standards){

function exportSettings(){
 const b=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});const url=URL.createObjectURL(b),a=el("a");a.href=url;a.download="RadioGrid-Settings.json";document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);notify("Backup download requested");
}
$("importPicker").onchange=async e=>{const f=e.target.files?.[0];if(!f)return;
 try{const data=normalise(JSON.parse(await f.text()));if(confirm("Replace your current settings with this backup?")){state=data;save();theme();render();showCurrentPage();notify("Backup restored");}}
 catch(_){alert("Import failed. Select a RadioGrid JSON backup.");}finally{e.target.value="";}
};
function resetDefaults(){if(!confirm("Restore all original categories, buttons and appearance? Export a backup first if needed."))return;state=defaults();save();theme();render();showCurrentPage();notify("Defaults restored");}
["gesturestart","gesturechange","gestureend"].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
document.addEventListener("touchmove",e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});
$("openSettings").onclick=()=>showModal("settings");
$("openEdit").onclick=()=>showModal("organize");
$("scrim").onclick=closeModal;
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("sheet").classList.contains("open")){if(["design","playback"].includes(editorPage))navigate("settings");else if(["section","button"].includes(editorPage))navigate("organize");else closeModal();}});
// The new button typography can use a different family from the title.
const oldApplyIdentity=applyIdentity;
applyIdentity=function(){oldApplyIdentity();document.documentElement.style.setProperty("--button-font",FONT_STACKS[state.buttonFontStyle]||FONT_STACKS[state.fontStyle]||FONT_STACKS.system);};

theme();render();installCategorySwipe();
</script>
</body>
</html>
