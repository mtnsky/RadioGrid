<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RadioGrid">
<meta name="theme-color" content="#0b0d10">
<title>RadioGrid</title>
<!-- V13: adds separately adjustable horizontal and vertical button spacing -->
<style>
  :root {
    color-scheme:dark;
    --bg:#0b0d10; --surface:#22252a; --surface2:#1b1e23;
    --text:#f6f6f7; --muted:#a3a7af; --accent:#e77d20;
    --line:rgba(255,255,255,.13); --sheet:#1b1d22; --card:#373a41;
    --danger:#ff6961; --tab-r:16px; --card-r:13px;
    --card-width:100%; --card-outline-color:#777b83; --card-outline-width:1px;
    --card-gap-x:10px; --card-gap-y:10px;
    --app-font:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
    --title-font-size:32px; --title-font-weight:800; --title-font-style:normal;
    --button-font-size:20px; --button-font-weight:800; --button-font-style:normal;
  }
  *,*::before,*::after { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { min-height:100%; background:var(--bg); touch-action:pan-x pan-y; }
  body {
    margin:0; height:100dvh; overflow:hidden; color:var(--text);
    font-family:var(--app-font);
    -webkit-font-smoothing:antialiased; overflow-x:hidden;
    background:radial-gradient(ellipse at 50% -30%, rgba(255,255,255,.06),transparent 56%),var(--bg);
  }
  [hidden] { display:none !important; }
  button,input,select { font:inherit; }
  button { cursor:pointer; color:inherit; border:0; -webkit-appearance:none; appearance:none; }
  button:focus-visible,input:focus-visible,select:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  /* Full-height app with one scrollable content region only when absolutely necessary. */
  .app { margin:auto; width:min(100%,760px); height:100dvh; display:flex; flex-direction:column; min-height:0;
    padding:max(8px,env(safe-area-inset-top)) 14px max(12px,env(safe-area-inset-bottom)); overflow:hidden; }
   .header { position:relative; flex:0 0 auto; display:flex; flex-direction:column;
    align-items:center; justify-content:center; height:76px; padding:4px 56px 7px; }
  .app-title { font-size:var(--title-font-size); font-weight:var(--title-font-weight); font-style:var(--title-font-style); line-height:1.08; letter-spacing:-.045em; margin:0; max-width:100%; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .subtitle { color:var(--muted); margin-top:8px; font-size:clamp(13px,3.4vw,18px); font-weight:480; letter-spacing:-.012em; white-space:nowrap; }
  .menu { position:absolute; right:0; top:50%; transform:translateY(-50%); width:48px; height:48px; display:grid; place-items:center; color:var(--accent); border-radius:15px; border:1px solid var(--line); background:linear-gradient(155deg,#25282d,#17191d); }
  .menu:active { filter:brightness(1.3); transform:translateY(-50%) scale(.97); }
  .menu svg { width:27px; height:27px; }
  /* Fixed, unscrollable category bar. Font is automatically fit to one line. */
  .tabs { flex:0 0 auto; display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:0;
    border-bottom:1px solid rgba(255,255,255,.11); margin:0 -14px 12px; padding:0 14px;
    overflow-x:hidden; touch-action:manipulation; }
  .tabs::-webkit-scrollbar { display:none; }
   .tab { min-width:0; position:relative; display:flex; flex-direction:column; align-items:center;
    justify-content:center; padding:13px 2px 15px; color:#a5aab2; background:transparent;
    font-size:15px; font-weight:700; text-align:center;
    white-space:nowrap; touch-action:manipulation; }
  .tab span { display:block; max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:clip; letter-spacing:-.025em; }
  .tab svg { display:none; }
  .tab.active { color:var(--accent); }
  .tab.active::after { content:""; position:absolute; bottom:0; left:8%; right:8%; height:4px; border-radius:6px 6px 0 0; background:var(--accent); }
  .tab:active { background:rgba(255,255,255,.035); }
  /* Full-width page strip tracks a finger drag and springs into place. */
  .page-track { width:100%; height:100%; display:flex; align-items:stretch;
    transform:translate3d(0,0,0); will-change:transform;
    transition:transform .34s cubic-bezier(.22,1,.36,1); }
  .page-slide { flex:0 0 100%; min-width:0; height:100%; overflow:hidden;
    touch-action:pan-y; overscroll-behavior-y:contain; -webkit-overflow-scrolling:touch; }
  .grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr));
    grid-auto-rows:var(--card-height,96px);
    column-gap:var(--card-gap-x); row-gap:var(--card-gap-y); align-content:start; }
  /* Uniform graphite text-only tiles, no illustrated icons */
  .card { min-width:0; width:var(--card-width); justify-self:center; height:100%; position:relative;
    display:flex; align-items:center; justify-content:center; text-align:center;
    padding:8px 8px; border-radius:var(--card-r);
    background:var(--card);
    border:var(--card-outline-width) solid var(--card-outline-color);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.08), 0 8px 20px rgba(0,0,0,.24);
    touch-action:pan-y; transition:transform .08s,filter .08s; }
  .card:active { transform:scale(.963); filter:brightness(1.18); }
  /* One shared font size for every button, including radio frequency and station name. */
  .card-label { min-width:0; max-height:100%; font-size:var(--button-font-size); font-weight:var(--button-font-weight); font-style:var(--button-font-style);
    line-height:1.14; letter-spacing:-.022em; color:#f3f4f5; overflow-wrap:normal; word-break:normal;
    display:block; width:100%; }
  .card-label .frequency, .card-label .callsign { display:block; font:inherit; line-height:1.14; }
  .card-label .callsign { margin-top:3px; }
  .page-viewport { flex:1 1 auto; min-height:0; overflow:hidden;
    touch-action:pan-y; overscroll-behavior:contain; }
  .grid-empty { color:var(--muted); padding:18px 4px; grid-column:1/-1; text-align:center; }
  .section-note { margin:15px 4px; color:#888e99; text-align:center; font-size:12px; }
  /* iOS-inspired editor */
  .scrim { position:fixed; inset:0; background:rgba(0,0,0,.60); z-index:8; opacity:0; pointer-events:none; transition:opacity .22s; }
  .scrim.open { opacity:1; pointer-events:auto; }
  .sheet { position:fixed; left:50%; bottom:0; z-index:9; width:min(100%,690px); max-height:min(91dvh,900px);
    display:flex; flex-direction:column; background:var(--sheet); border-radius:30px 30px 0 0;
    border:1px solid rgba(255,255,255,.14); border-bottom:0; box-shadow:0 -17px 55px rgba(0,0,0,.5);
    padding-bottom:env(safe-area-inset-bottom); transform:translate(-50%,105%); visibility:hidden;
    transition:transform .26s cubic-bezier(.2,.8,.2,1),visibility .26s; }
  .sheet.open { transform:translate(-50%,0); visibility:visible; }
  .grabber { width:39px; height:5px; background:#60636b; border-radius:999px; margin:9px auto 0; flex:none; }
  .sheet-head { flex:none; display:grid; grid-template-columns:68px 1fr 68px; align-items:center; min-height:68px; padding:8px 14px 10px; border-bottom:1px solid rgba(255,255,255,.07); }
  .sheet-head h2 { margin:0; text-align:center; font-size:19px; font-weight:760; letter-spacing:-.035em; }
  .sheet-action { color:var(--accent); font-size:16px; padding:10px 0; background:transparent; text-align:left; }
  .sheet-action:last-child { text-align:right; font-weight:700; }
  .sheet-body { overflow-y:auto; padding:17px 14px 28px; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; }
  .settings-tile { display:flex; align-items:center; gap:14px; width:100%; text-align:left; min-height:81px; border-radius:20px; padding:13px 14px;
    background:linear-gradient(165deg,#292c32,#22252b); border:1px solid rgba(255,255,255,.07); margin-bottom:11px; }
  .settings-tile:active { filter:brightness(1.16); }
  .settings-icon { flex:none; display:grid; place-items:center; width:43px; height:43px; color:var(--accent); }
  .settings-icon svg { width:35px; height:35px; }
  .settings-text { min-width:0; flex:1; }
  .settings-title { display:block; color:#fff; font-size:17px; font-weight:710; }
  .settings-sub { display:block; color:var(--muted); margin-top:4px; font-size:12px; line-height:1.3; }
  .chevron { color:#8b9099; }
  .chevron svg { width:21px; height:21px; }
  .group-label { text-transform:uppercase; letter-spacing:.08em; color:#969ca6; font-size:11px; font-weight:720; margin:22px 9px 9px; }
  .group-label:first-child { margin-top:5px; }
  .group-box { border-radius:17px; background:#2a2d33; overflow:hidden; margin-bottom:12px; }
  .edit-row { display:flex; align-items:center; gap:8px; padding:5px 7px 5px 10px; min-height:59px; border-bottom:1px solid rgba(255,255,255,.075); }
  .edit-row:last-child { border-bottom:0; }
  .edit-row.dragging { background:rgba(231,125,32,.20); }
  .edit-row-name { min-width:0; flex:1; overflow-wrap:anywhere; font-size:14px; font-weight:600; }
  .edit-row-sub { display:block; font-size:11px; color:var(--muted); margin-top:3px; font-weight:450; }
  .mini-dot { width:11px; height:11px; flex:none; border-radius:50%; background:var(--accent); }
  .mini-icon { display:grid; place-items:center; width:26px; height:26px; flex:none; color:var(--accent); }
  .mini-icon svg { width:23px; height:23px; }
  .icon-btn { flex:none; width:31px; height:40px; padding:5px; display:grid; place-items:center; color:#b1b5be; background:transparent; border-radius:10px; }
  .icon-btn svg { width:19px; height:19px; }
  .icon-btn:active { background:rgba(255,255,255,.1); }
  .icon-btn:disabled { opacity:.2; }
  .icon-btn.danger { color:var(--danger); }
  .icon-btn.handle { touch-action:none; cursor:grab; color:#9297a2; }
  .plain-add { display:flex; width:100%; align-items:center; gap:9px; text-align:left; color:var(--accent); min-height:53px; padding:10px 14px; background:transparent; font-weight:640; }
  .plain-add svg { width:20px; height:20px; }
  .plain-add:active { background:rgba(255,255,255,.055); }
  .field-set { border-radius:16px; background:#2a2d33; overflow:hidden; }
  .field { display:flex; min-height:54px; gap:12px; align-items:center; padding:9px 14px; border-bottom:1px solid rgba(255,255,255,.09); }
  .field:last-child { border:0; }
  .field label { flex:0 0 94px; font-size:14px; }
  .field input[type="text"],.field input[type="url"],.field select { flex:1; min-width:0; padding:8px 0; border:0; outline:0; background:transparent; color:#fff; font-size:16px; border-radius:0; }
  .field select { color:var(--accent); }
  .font-sample { margin:8px 0 18px; padding:12px 14px; border-radius:14px; background:rgba(255,255,255,.045); border:1px solid var(--line); }
  .font-sample-title { font-size:18px; font-weight:700; line-height:1.2; overflow-wrap:anywhere; }
  .font-sample-detail { font-size:13px; color:var(--muted); margin:10px 0 7px; }
  .button-preview-lane { display:flex; justify-content:center; width:min(100%,270px); margin-top:7px; }
  .font-sample-button { display:inline-flex; align-items:center; justify-content:center; min-width:0; max-width:100%; padding:8px; border-radius:13px; background:var(--card); border:1px solid rgba(255,255,255,.2); text-align:center; line-height:1.1; overflow-wrap:anywhere; overflow:hidden; }
  .spacing-preview-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); width:100%; }
  .spacing-preview-tile { min-width:0; justify-self:center; display:flex; align-items:center; justify-content:center; text-align:center; width:100%; padding:5px; background:var(--card); color:#f3f4f5; overflow:hidden; line-height:1.15; }
  .type-slider-control { flex:1; min-width:0; display:flex; align-items:center; gap:10px; }
  .type-slider-control input[type=range] { flex:1; min-width:0; width:100%; accent-color:var(--accent); height:32px; touch-action:pan-x; }
  .type-size-output { font-size:13px; font-variant-numeric:tabular-nums; color:var(--muted); min-width:39px; text-align:right; }
  .field.typography-field label { flex-basis:94px; }
  .field.check label { flex:1; width:auto; }
  .field input[type=checkbox] { appearance:auto; -webkit-appearance:checkbox; accent-color:var(--accent); width:23px; height:23px; flex:none; }
  .field option { color:#000; }
  .field input::placeholder { color:#868b94; }
  .field.check label { flex:1; }
  .field input[type="checkbox"] { width:23px; height:23px; accent-color:var(--accent); }
  .field input[type="color"] { border:0; background:transparent; width:45px; height:36px; padding:0; }
  .palette { display:flex; flex-wrap:wrap; gap:11px; padding:11px 5px; }
  .swatch { border-radius:50%; width:37px; height:37px; border:2px solid rgba(255,255,255,.15); background:var(--swatch); }
  .swatch.selected { outline:2px solid white; outline-offset:2px; }
  .helper { color:var(--muted); font-size:12px; padding:0 8px 12px; line-height:1.45; }
  .error { color:#ff8e86; font-size:13px; min-height:20px; padding:8px; }
  .save { width:100%; min-height:49px; border-radius:14px; background:var(--accent); color:#101215; font-weight:800; font-size:17px; margin:7px 0 16px; }
  .save:active { filter:brightness(1.2); }
  .normal-row { display:block; width:100%; padding:15px 13px; min-height:48px; text-align:left; background:transparent; border-bottom:1px solid rgba(255,255,255,.1); font-size:14px; }
  .normal-row:last-child { border:0; }
  .normal-row:active { background:rgba(255,255,255,.08); }
  .normal-row.danger { color:var(--danger); }
  .toast { position:fixed; z-index:30; left:50%; bottom:max(24px,env(safe-area-inset-bottom)); transform:translate(-50%,14px); opacity:0; pointer-events:none; background:#393b40;
    padding:11px 15px; border-radius:16px; color:white; font-size:13px; font-weight:650; white-space:nowrap; transition:transform .2s,opacity .2s; }
  .toast.show { opacity:1; transform:translate(-50%,0); }
  .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
  @media(max-width:365px) {
    .app { padding-left:8px; padding-right:8px; }
    .tabs { margin-left:-8px; margin-right:-8px; padding:0 8px; }
    .card { gap:7px; }
    .tab { font-size:14px; }

    .icon-btn { width:27px; }
  }
  @media(prefers-reduced-motion:reduce) { *,*::before,*::after { transition-duration:.01ms!important; animation-duration:.01ms!important; } }
  /* Compact inline editing in the single Settings sheet */
  .inline-form { margin:8px 7px 15px; padding:14px 12px; border-radius:16px;
    border:1px solid rgba(231,125,32,.36); background:#22252b; }
  .inline-heading { font-size:16px; font-weight:750; margin:0 0 12px; }
  .inline-actions { display:flex; gap:10px; justify-content:flex-end; margin-top:5px; }
  .inline-actions button { min-height:44px; min-width:78px; padding:8px 15px; border-radius:12px; font-weight:700; }
  .inline-cancel { background:#34383f; color:#f2f2f2; }
  .inline-save { background:var(--accent); color:#121416; }
  .editor-host:empty { display:none; }
  .manage-section > .edit-row { background:rgba(255,255,255,.045); }
  .manage-section { margin-bottom:13px; }
  .manage-item .edit-row-name { font-weight:500; }
  .sheet-body > .plain-add { border-radius:15px; background:#292d33; margin-bottom:8px; }
  @media(max-width:420px) { .field label { flex-basis:78px; } .edit-row { gap:3px; padding-left:5px; padding-right:4px; } .icon-btn { width:28px; } }
</style>
</head>
<body>
<main class="app">
  <header class="header">
    <h1 class="app-title">RadioGrid</h1>
    <button class="menu" type="button" id="openSettings" aria-label="Open settings" title="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
  </header>
  <nav class="tabs" id="tabs" aria-label="RadioGrid categories"></nav>
  <section class="page-viewport" id="pageViewport" aria-label="Swipe left or right here to change category">
    <div class="page-track" id="pageTrack" aria-label="Audio shortcut pages"></div>
  </section>
</main>
<div id="scrim" class="scrim" aria-hidden="true"></div>
<section id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" aria-hidden="true">
  <div class="grabber" aria-hidden="true"></div>
  <header class="sheet-head">
    <button type="button" class="sheet-action" id="sheetBack">Close</button>
    <h2 id="sheetTitle">Settings</h2>
    <button type="button" class="sheet-action" id="sheetDone">Done</button>
  </header>
  <div class="sheet-body" id="sheetBody"></div>
</section>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input id="importPicker" class="sr-only" type="file" accept="application/json,.json">

 const scroll=preserveScroll?bodyEl.scrollTop:0;
 shown="home";
 const body=sheet("Settings","","Done",closeSheet,closeSheet);
 $("sheetBack").style.visibility="hidden";
 body.append(group("App Title & Typography"));
 const identity=el("div","field-set");
 const titleInput=textInput(state.appTitle||DEFAULT_APP_TITLE,"App title");
 titleInput.maxLength=32;
 titleInput.setAttribute("aria-label","App title");
 const fontSelect=selectInput(FONT_OPTIONS,state.fontStyle||DEFAULT_FONT_STYLE);
 fontSelect.setAttribute("aria-label","Font family across the entire app");
 identity.append(field("App title",titleInput),field("Font family",fontSelect));
 body.append(identity);

 const saveTypography=()=>{save();applyIdentity();drawSamples();};
 const titleText=el("div","field-set");
 titleText.append(
   sizeField("Font size",state.titleFontSize,22,48,v=>{state.titleFontSize=v;saveTypography();}),
   toggleField("Bold",state.titleBold,v=>{state.titleBold=v;saveTypography();}),
   toggleField("Italic",state.titleItalic,v=>{state.titleItalic=v;saveTypography();})
 );
 body.append(group("Title Typography"),titleText);
 const buttonText=el("div","field-set");
 buttonText.append(
   sizeField("Font size",state.buttonFontSize,15,25,v=>{state.buttonFontSize=v;saveTypography();}),
   toggleField("Bold",state.buttonBold,v=>{state.buttonBold=v;saveTypography();}),
   toggleField("Italic",state.buttonItalic,v=>{state.buttonItalic=v;saveTypography();})
 );
 body.append(group("Button Typography"),buttonText);

 body.append(group("Button Shape & Outline"));
 const shape=el("div","field-set");
 const saveButtonAppearance=()=>{save();applyButtonStyle();sizeGrid();drawSamples();};
 shape.append(
   sizeField("Width",state.buttonStyle.width,75,100,v=>{state.buttonStyle.width=v;saveButtonAppearance();},"%"),
   sizeField("Height",state.buttonStyle.height,56,120,v=>{state.buttonStyle.height=v;saveButtonAppearance();}),
   sizeField("Outline",state.buttonStyle.outlineWidth,0,4,v=>{state.buttonStyle.outlineWidth=v;saveButtonAppearance();}),
   sizeField("Corners",state.buttonStyle.cornerRadius,0,28,v=>{state.buttonStyle.cornerRadius=v;saveButtonAppearance();})
 );
 const outlineColor=el("input");outlineColor.type="color";outlineColor.value=state.buttonStyle.outlineColor;
 outlineColor.oninput=()=>{state.buttonStyle.outlineColor=outlineColor.value;saveButtonAppearance();};
 shape.append(field("Border color",outlineColor));
 body.append(shape,el("p","helper","Width stays within its grid column. Height is a target: RadioGrid reduces it only when necessary to keep all rows on screen. Text shrinks automatically if it would spill outside a button."));
 body.append(group("Button Spacing"));
 const spacing=el("div","field-set");
 spacing.append(
   sizeField("Horizontal",state.buttonStyle.gapX,0,24,v=>{state.buttonStyle.gapX=v;saveButtonAppearance();}),
   sizeField("Vertical",state.buttonStyle.gapY,0,24,v=>{state.buttonStyle.gapY=v;saveButtonAppearance();})
 );
 body.append(spacing,el("p","helper","Horizontal changes space between columns. Vertical changes space between rows. All buttons remain inside the screen where the available height permits."));

 const sample=el("div","font-sample");
 const sampleName=el("div","font-sample-title");
 const sampleDetail=el("div","font-sample-detail","BUTTON PREVIEW");
 const sampleButton=el("div","font-sample-button","Americana");
 const sampleLane=el("div","button-preview-lane");sampleLane.append(sampleButton);
 sample.append(sampleName,sampleDetail,sampleLane);
 const spacingDetail=el("div","font-sample-detail","SPACING PREVIEW");
 const spacingGrid=el("div","spacing-preview-grid");
 for (const label of ["80’s","Americana","Rock","Country","Oldies","Worship"]) {
   const tile=el("div","spacing-preview-tile",label);
   spacingGrid.append(tile);
 }
 sample.append(spacingDetail,spacingGrid);
 body.append(sample);
 function drawSamples(){
   sampleName.textContent=state.appTitle||DEFAULT_APP_TITLE;
   sampleName.style.fontSize=Math.min(state.titleFontSize,32)+"px";
   sampleName.style.fontWeight=state.titleBold?"800":"450";
   sampleName.style.fontStyle=state.titleItalic?"italic":"normal";
   sampleButton.style.fontSize=state.buttonFontSize+"px";
   sampleButton.style.fontWeight=state.buttonBold?"800":"450";
   sampleButton.style.fontStyle=state.buttonItalic?"italic":"normal";
   sampleButton.style.width=state.buttonStyle.width+"%";
   sampleButton.style.height=Math.min(state.buttonStyle.height,110)+"px";
   sampleButton.style.border=state.buttonStyle.outlineWidth+"px solid "+state.buttonStyle.outlineColor;
   sampleButton.style.borderRadius=state.buttonStyle.cornerRadius+"px";
   spacingGrid.style.columnGap=state.buttonStyle.gapX+"px";
   spacingGrid.style.rowGap=state.buttonStyle.gapY+"px";
   spacingGrid.querySelectorAll(".spacing-preview-tile").forEach(tile=>{
     tile.style.width=state.buttonStyle.width+"%";
     tile.style.height=Math.min(state.buttonStyle.height,56)+"px";
     tile.style.border=state.buttonStyle.outlineWidth+"px solid "+state.buttonStyle.outlineColor;
     tile.style.borderRadius=state.buttonStyle.cornerRadius+"px";
     tile.style.fontSize="12px";
   });
 }
 drawSamples();
 titleInput.oninput=()=>{
   state.appTitle=titleInput.value.trim().slice(0,32)||DEFAULT_APP_TITLE;
   saveTypography();
 };
 titleInput.onblur=()=>{
   if(!titleInput.value.trim())titleInput.value=DEFAULT_APP_TITLE;
   state.appTitle=titleInput.value.trim().slice(0,32);
   saveTypography();
 };
 fontSelect.onchange=()=>{
   state.fontStyle=fontSelect.value;
   saveTypography();
   notify("Font family saved");
 };
 body.append(el("p","helper","Typography and button appearance save automatically. Labels use the shared font size when possible and shrink only if needed to stay inside a card. The Home Screen icon label may require reinstalling the icon to update."));
 body.append(group("Sections & Buttons"),el("p","helper","Drag handles or use arrows to reorder. Tap a pencil to edit a name, target, or section in place."));
 const root=el("div","");root.id="manageRoot";
 state.sections.forEach((section,sindex)=>{
   const block=el("div","group-box manage-section");block.dataset.sectionId=section.id;
   const head=el("div","edit-row");const grip=miniButton("grip","Drag section "+section.name,null,"handle");
   const dot=el("span","mini-dot");const title=el("div","edit-row-name",section.name);
   const up=miniButton("up","Move section up",()=>swap(state.sections,sindex,-1));up.disabled=sindex===0;
   const down=miniButton("down","Move section down",()=>swap(state.sections,sindex,1));down.disabled=sindex===state.sections.length-1;
   head.append(grip,dot,title,up,down,miniButton("pencil","Edit section "+section.name,()=>showSectionEditor(section.id,block)),miniButton("trash","Delete section "+section.name,()=>deleteSection(section.id),"danger"));
   block.append(head);
   const items=el("div","manage-items");items.dataset.sectionId=section.id;
   section.items.forEach((item,i)=>{
     const row=el("div","edit-row manage-item");row.dataset.itemId=item.id;
     const drag=miniButton("grip","Drag "+item.name,null,"handle");
     const label=el("div","edit-row-name",item.name);label.append(el("span","edit-row-sub",item.action==="url"?"Direct link":"Shortcut"));
     const u=miniButton("up","Move "+item.name+" up",()=>swap(section.items,i,-1));u.disabled=i===0;
     const d=miniButton("down","Move "+item.name+" down",()=>swap(section.items,i,1));d.disabled=i===section.items.length-1;
     row.append(drag,label,u,d,miniButton("pencil","Edit "+item.name,()=>showButtonEditor(item.id,section.id,row)),miniButton("trash","Delete "+item.name,()=>deleteButton(item.id),"danger"));
     items.append(row);connectDrag(drag,row,"item");
   });
   const addHost=el("div","editor-host");
   block.append(items,addRow("Add Button",()=>showButtonEditor(null,section.id,addHost)),addHost);
   root.append(block);connectDrag(grip,block,"section");
 });
 body.append(root);
 const newHost=el("div","editor-host");
 body.append(addRow("Add Section",()=>showSectionEditor(null,newHost)),newHost);
 body.append(group("Appearance"));
 const colors=el("div","field-set");
 for(const [key,label] of [["accent","Accent orange"],["card","Button gray"],["background","Background"]]){
   const input=el("input");input.type="color";input.value=state.theme[key]||DEFAULT_THEME[key];
   input.oninput=()=>{state.theme[key]=input.value;save();theme();render();};
   colors.append(field(label,input));
 }
 body.append(colors,normalRow("Restore original colors",()=>{state.theme=clone(DEFAULT_THEME);changed("Colors restored");}));
 body.append(group("Return after playing"));
 const method=selectInput([["website","Website link"],["webapp","Home Screen app (experimental)"],["shortcut","Launch Radio Grid Shortcut"]],state.returnMethod);
 method.onchange=()=>{state.returnMethod=method.value;save();notify("Return method saved");};
 const ret=el("div","field-set");ret.append(field("Method",method));body.append(ret);
 body.append(el("p","helper","The callback runs after the selected Shortcut finishes. A website link may open in Safari; the Home Screen option is unofficial."));
 body.append(group("Backup & Restore"));
 const backups=el("div","group-box");backups.append(normalRow("Export settings as JSON",exportSettings),normalRow("Import settings from JSON",()=>$('importPicker').click()),normalRow("Restore original layout",resetDefaults,true));body.append(backups);
 body.append(el("p","helper",storageWorks?"Changes are saved locally for this web app. Export a backup before changing the website address or reinstalling.":"Browser storage is unavailable; export a backup before leaving."));
 body.scrollTop=scroll;
}
function miniButton(icon,description,fn,extra=""){const b=el("button","icon-btn "+extra);b.type="button";b.setAttribute("aria-label",description);b.title=description;b.append(svg(icon));if(fn)b.onclick=fn;return b;}
function addRow(label,fn){const b=el("button","plain-add");b.type="button";b.append(svg("plus"),el("span","",label));b.onclick=fn;return b;}
function swap(list,index,dir){const j=index+dir;if(j<0||j>=list.length)return;[list[index],list[j]]=[list[j],list[index]];changed("Order updated");}
function connectDrag(handle,row,kind){let pointer=null,changedOrder=false;
 handle.addEventListener("pointerdown",e=>{if(e.pointerType==="mouse"&&e.button!==0)return;pointer=e.pointerId;changedOrder=false;handle.setPointerCapture(pointer);row.classList.add("dragging");e.preventDefault();});
 handle.addEventListener("pointermove",e=>{
   if(pointer!==e.pointerId)return;
   const hit=document.elementFromPoint(e.clientX,e.clientY);if(!hit)return;
   if(kind==="section"){
     const dest=hit.closest(".manage-section");if(!dest||dest===row)return;
     const mid=dest.getBoundingClientRect();$("manageRoot").insertBefore(row,e.clientY<(mid.top+mid.height/2)?dest:dest.nextSibling);changedOrder=true;
   }else{
     const dest=hit.closest(".manage-item");
     if(dest&&dest!==row){const mid=dest.getBoundingClientRect();dest.parentNode.insertBefore(row,e.clientY<mid.top+mid.height/2?dest:dest.nextSibling);changedOrder=true;}
     else if(!dest){const parent=hit.closest(".manage-items")||hit.closest(".manage-section")?.querySelector(".manage-items");if(parent&&parent!==row.parentElement){parent.append(row);changedOrder=true;}}
   }
 });
 const end=e=>{if(pointer!==e.pointerId)return;pointer=null;row.classList.remove("dragging");if(changedOrder)syncOrder();};handle.addEventListener("pointerup",end);handle.addEventListener("pointercancel",end);
}
function syncOrder(){const root=$("manageRoot");if(!root)return;const sectionsById=new Map(state.sections.map(s=>[s.id,s]));const itemsById=new Map(state.sections.flatMap(s=>s.items.map(i=>[i.id,i])));
 const next=[];root.querySelectorAll(":scope > .manage-section").forEach(box=>{const section=sectionsById.get(box.dataset.sectionId);if(!section)return;section.items=[...box.querySelectorAll(":scope > .manage-items > .manage-item")].map(n=>itemsById.get(n.dataset.itemId)).filter(Boolean);next.push(section);});
 state.sections=next;changed("Reordered");
}
function deleteSection(id){const s=state.sections.find(v=>v.id===id);if(!s||!confirm("Delete ‘"+s.name+"’ and its "+s.items.length+" button(s)?"))return;state.sections=state.sections.filter(v=>v.id!==id);if(!state.sections.some(v=>v.id===state.active))state.active=state.sections[0]?.id||"";changed("Section deleted");}
function findItem(id){for(const s of state.sections){const i=s.items.find(v=>v.id===id);if(i)return {section:s,item:i};}return null;}
function deleteButton(id){const f=findItem(id);if(!f||!confirm("Delete ‘"+f.item.name+"’?"))return;f.section.items=f.section.items.filter(v=>v.id!==id);changed("Button deleted");}
function field(labelText,control){const row=el("div","field");const lab=el("label","",labelText);if(!control.id)control.id=uid();lab.htmlFor=control.id;row.append(lab,control);return row;}
function textInput(value,placeholder=""){const n=el("input");n.type="text";n.value=value||"";n.placeholder=placeholder;n.autocomplete="off";return n;}
function selectInput(options,value){const n=el("select");for(const [id,title] of options){const opt=el("option","",title);opt.value=id;n.append(opt);}n.value=value;return n;}
function checkRow(label,checked){const input=el("input");input.type="checkbox";input.checked=checked;const row=field(label,input);row.classList.add("check");return {row,input};}
function sizeField(label,value,min,max,onUpdate,unit="px"){
 const slider=el("input");slider.type="range";slider.min=min;slider.max=max;slider.step=1;slider.value=value;
 slider.setAttribute("aria-label",label+(unit==="%"?" in percent":" in pixels"));
 const output=el("output","type-size-output",value+(unit==="%"?"%":" px"));
 const controls=el("div","type-slider-control");controls.append(slider,output);
 slider.addEventListener("input",()=>{const v=Number(slider.value);output.textContent=v+(unit==="%"?"%":" px");onUpdate(v);});
 const row=el("div","field typography-field");
 slider.id=uid();const text=el("label","",label);text.htmlFor=slider.id;
 row.append(text,controls);return row;
}
function toggleField(label,checked,onUpdate){
 const {row,input}=checkRow(label,checked);
 input.setAttribute("aria-label",label);
 input.onchange=()=>onUpdate(input.checked);
 return row;
}
function colorSelector(initial,onChange,inherit=false){const area=el("div","");const palette=el("div","palette");const buttons=[];let selected=initial||"";
 if(inherit){const b=el("button","swatch","↻");b.type="button";b.style.setProperty("--swatch","#454950");b.title="Use default orange";b.style.color="#fff";b.onclick=()=>{selected="";paint();onChange("");};palette.append(b);buttons.push([b,""]);}
 for(const c of PALETTE){const b=el("button","swatch");b.type="button";b.style.setProperty("--swatch",c);b.setAttribute("aria-label","Select "+c);b.onclick=()=>{selected=c;paint();onChange(c);};palette.append(b);buttons.push([b,c]);}
 function paint(){for(const [b,c] of buttons)b.classList.toggle("selected",selected.toLowerCase()===c.toLowerCase());}
 paint();area.append(palette);const inp=el("input");inp.type="color";inp.value=safeColor(initial)||DEFAULT_THEME.accent;inp.oninput=()=>{selected=inp.value;paint();onChange(inp.value);};area.append(field("Custom color",inp));return area;
}
// Inline editors remain within the same Settings page, not separate screens.
function mountEditor(host, build){
 $("sheetBody").querySelectorAll(".inline-form").forEach(n=>n.remove());
 const panel=el("div","inline-form");host.after(panel);
 build(panel);
 panel.scrollIntoView({block:"nearest",behavior:"smooth"});
}
function showSectionEditor(id,host){
 const section=id?state.sections.find(s=>s.id===id):null;
 mountEditor(host,panel=>{
   panel.append(el("div","inline-heading",section?"Edit section":"New section"));
   const name=textInput(section?.name||"","Section name");
   const fields=el("div","field-set");fields.append(field("Name",name));panel.append(fields);
   const err=el("div","error");panel.append(err);
   const actions=el("div","inline-actions");
   const cancel=el("button","inline-cancel","Cancel");cancel.type="button";cancel.onclick=()=>panel.remove();
   const done=el("button","inline-save","Save");done.type="button";done.onclick=()=>{
     const n=name.value.trim();if(!n){err.textContent="Enter a section name.";return;}
     if(section)section.name=n;
     else {const s={id:uid(),name:n,icon:"broadcast",items:[]};state.sections.push(s);if(!state.active)state.active=s.id;}
     changed("Section saved");
   };
   actions.append(cancel,done);panel.append(actions);
 });
}
function showButtonEditor(id,sectionId,host){
 const found=id?findItem(id):null;const item=found?.item||null;
 mountEditor(host,panel=>{
   panel.append(el("div","inline-heading",item?"Edit button":"New button"));
   const name=textInput(item?.name||"","Displayed button name");
   const section=selectInput(state.sections.map(s=>[s.id,s.name]),found?.section.id||sectionId||state.sections[0]?.id);
   const action=selectInput([["shortcut","Run Shortcut"],["url","Open Link"]],item?.action||"shortcut");
   const target=textInput(item?.target||"","Exact Shortcut name");
   const ret=checkRow("Return to RadioGrid",!item?.noReturn);
   const fields=el("div","field-set");const targetRow=field("Shortcut",target);
   fields.append(field("Name",name),field("Section",section),field("Action",action),targetRow,ret.row);
   panel.append(fields);
   function syncAction(){const isURL=action.value==="url";targetRow.querySelector("label").textContent=isURL?"Link":"Shortcut";target.placeholder=isURL?"https://music.apple.com/...":"Exact Shortcut name";ret.row.hidden=isURL;}
   action.onchange=syncAction;syncAction();
   const err=el("div","error");panel.append(err);
   const actions=el("div","inline-actions");
   const cancel=el("button","inline-cancel","Cancel");cancel.type="button";cancel.onclick=()=>panel.remove();
   const done=el("button","inline-save","Save");done.type="button";done.onclick=()=>{
     const n=name.value.trim(),t=target.value.trim(),dest=state.sections.find(s=>s.id===section.value);
     if(!n||!t){err.textContent="Enter a button name and destination.";return;}
     if(action.value==="url"&&!/^(https?:|music:|podcasts:|spotify:|overcast:|x-apple-music:)/i.test(t)){err.textContent="Use a valid HTTPS or supported app link.";return;}
     if(!dest){err.textContent="Select an existing section.";return;}
     const next={id:item?.id||uid(),name:n,icon:item?.icon||"music",action:action.value,target:t,noReturn:action.value==="shortcut"&&!ret.input.checked,color:item?.color||""};
     if(found){const at=found.section.items.findIndex(i=>i.id===id);found.section.items.splice(at,1);if(dest===found.section)dest.items.splice(at,0,next);else dest.items.push(next);}
     else dest.items.push(next);
     changed("Button saved");
   };
   actions.append(cancel,done);panel.append(actions);
 });
}
function exportSettings(){const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});const url=URL.createObjectURL(blob);const a=el("a");a.href=url;a.download="RadioGrid-Settings.json";document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);notify("Download requested");}
$("importPicker").onchange=async e=>{const file=e.target.files?.[0];if(!file)return;try{const data=normalise(JSON.parse(await file.text()));if(confirm("Replace current RadioGrid configuration with this backup?")){state=data;changed("Settings imported");settingsHome(true);}}catch(_){alert("Import failed. Choose a valid RadioGrid settings JSON file.");}finally{e.target.value="";}};
function resetDefaults(){if(!confirm("Restore all original sections, buttons, and colors? Export a backup first if needed."))return;state=defaults();changed("Defaults restored");}
// iOS Safari pinch-to-zoom prevention, while preserving one-finger scrolling.
["gesturestart","gesturechange","gestureend"].forEach(type=>document.addEventListener(type,e=>e.preventDefault(),{passive:false}));
document.addEventListener("touchmove",e=>{if(e.touches.length>1)e.preventDefault();},{passive:false});
$("openSettings").onclick=openSheet;$("scrim").onclick=closeSheet;
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("sheet").classList.contains("open")){closeSheet();}});
theme();render();installCategorySwipe();
</script>
