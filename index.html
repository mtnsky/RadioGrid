 const theme=data.theme||{};
 const active=sections.some(s=>s.id===data.active)?data.active:sections[0]?.id||"";
 return {sections,active,theme:{accent:safeColor(theme.accent)||DEFAULT_THEME.accent,background:safeColor(theme.background)||safeColor(theme.bg)||DEFAULT_THEME.background,surface:safeColor(theme.surface)||safeColor(theme.panel)||DEFAULT_THEME.surface,surface2:safeColor(theme.surface2)||safeColor(theme.panel2)||DEFAULT_THEME.surface2},returnMethod:data.returnMethod==="webapp"?"webapp":data.returnMethod==="shortcut"?"shortcut":"website"};
}
let state=defaults(),storageWorks=false,shown="home",lastFocus=null,toastTimer=null;
try{
 localStorage.setItem(KEY+"probe","1");localStorage.removeItem(KEY+"probe");storageWorks=true;
 const saved=localStorage.getItem(KEY);
 if(saved){state=normalise(JSON.parse(saved));}
 else {
   for(const legacy of LEGACY){const v=localStorage.getItem(legacy);if(!v)continue;
     const obj=JSON.parse(v);state=normalise(Array.isArray(obj)?{sections:obj,active:"podcasts",theme:DEFAULT_THEME}:obj);break;
   }
 }
}catch(e){storageWorks=false;state=defaults();}
function save(){if(!storageWorks)return;try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){storageWorks=false;}}
function theme(){const root=document.documentElement;root.style.setProperty("--accent",state.theme.accent);root.style.setProperty("--bg",state.theme.background);root.style.setProperty("--surface",state.theme.surface);root.style.setProperty("--surface2",state.theme.surface2);document.querySelector('meta[name="theme-color"]').content=state.theme.background;}
function notify(message){clearTimeout(toastTimer);$("toast").textContent=message;$("toast").classList.add("show");toastTimer=setTimeout(()=>$("toast").classList.remove("show"),1800);}
function changed(message="Saved"){save();theme();render();if(shown==="manage"&&$("sheet").classList.contains("open"))manager();if(message)notify(storageWorks?message:"Change made — export a backup");}
function activeSection(){return state.sections.find(s=>s.id===state.active)||state.sections[0]||null;}
function iconFor(name,cl){const x=el("span",cl);x.append(svg(name));return x;}
function render(){
 const tabs=$("tabs"),grid=$("grid");tabs.replaceChildren();grid.replaceChildren();
 for(const section of state.sections){
   const b=el("button","tab"+(activeSection()?.id===section.id?" active":""));b.type="button";b.setAttribute("aria-current",activeSection()?.id===section.id?"page":"false");b.append(svg(section.icon),el("span","",section.name));
   b.onclick=()=>{state.active=section.id;save();render();};tabs.append(b);
 }
 const section=activeSection();if(!section){grid.append(el("p","grid-empty","Add a section using Settings."));return;}
 for(const [index,item] of section.items.entries()){
   const card=el("button","card");card.type="button";card.setAttribute("aria-label","Play "+item.name);
   card.style.setProperty("--icon-color",item.color||(index%3===1?"#b8bec8":state.theme.accent));
   card.append(iconFor(item.icon,"card-icon"),el("span","card-label",item.name));card.onclick=()=>run(item);grid.append(card);
 }
 const add=el("button","card add");add.type="button";add.setAttribute("aria-label","Add button to "+section.name);add.append(iconFor("plus","card-icon"),el("span","card-label","Add Button"));add.onclick=()=>{openSheet();editButton(null,section.id);};grid.append(add);
}
function returnURL(){
 if(state.returnMethod==="shortcut"||!/^https?:$/.test(location.protocol))return "shortcuts://run-shortcut?name="+encodeURIComponent("Radio Grid");
 const url=new URL(location.href);url.hash="";url.searchParams.delete("result");url.searchParams.delete("errorMessage");
 return state.returnMethod==="webapp"?"webapp://"+url.host+url.pathname+url.search:url.href;
}
function run(item){
 if(item.action==="url"){
   if(!/^(https?:|music:|podcasts:|spotify:|overcast:|x-apple-music:)/i.test(item.target)){notify("Invalid link. Edit this button.");return;}
   location.href=item.target;return;
 }
 if(!item.target?.trim()){notify("Missing Shortcut name");return;}
 const base="shortcuts://run-shortcut?name="+encodeURIComponent(item.target);
 if(item.noReturn){location.href=base;return;}
 const ret=returnURL();
 location.href="shortcuts://x-callback-url/run-shortcut?name="+encodeURIComponent(item.target)+"&x-success="+encodeURIComponent(ret)+"&x-cancel="+encodeURIComponent(ret)+"&x-error="+encodeURIComponent(ret);
}
function openSheet(){lastFocus=document.activeElement;$("scrim").classList.add("open");$("sheet").classList.add("open");$("sheet").setAttribute("aria-hidden","false");document.body.style.overflow="hidden";settingsHome();$("sheetDone").focus();}
function closeSheet(){$("scrim").classList.remove("open");$("sheet").classList.remove("open");$("sheet").setAttribute("aria-hidden","true");document.body.style.overflow="";shown="home";lastFocus?.focus?.();}
function sheet(title,back,done,backAction,doneAction){$("sheetTitle").textContent=title;$("sheetBack").textContent=back;$("sheetDone").textContent=done;$("sheetBack").onclick=backAction;$("sheetDone").onclick=doneAction;$("sheetBody").replaceChildren();$("sheetBody").scrollTop=0;return $("sheetBody");}
function group(name){return el("div","group-label",name);}
function settingsTile(icon,title,sub,action){const b=el("button","settings-tile");b.type="button";const txt=el("span","settings-text");txt.append(el("span","settings-title",title),el("span","settings-sub",sub));b.append(iconFor(icon,"settings-icon"),txt,iconFor("chevron","chevron"));b.onclick=action;return b;}
function normalRow(text,fn,danger=false){const b=el("button","normal-row"+(danger?" danger":""),text);b.type="button";b.onclick=fn;return b;}
function settingsHome(){shown="home";const body=sheet("Home Screen Settings","Close","Done",closeSheet,closeSheet);
 body.append(settingsTile("sections","Edit Sections","Add, remove, rename, and reorder your tabs",manager),
   settingsTile("move","Reorder Buttons","Drag or use arrows to rearrange your audio sources",manager),
   settingsTile("palette","Change Colors","Orange accents and graphite surfaces",editTheme),
   settingsTile("plus","Add Button","Create a new station, podcast, or shortcut",()=>editButton(null,activeSection()?.id)));
 body.append(group("Shortcut return"));const methods=el("div","group-box");
 for(const [key,title] of [["website","Website link (recommended)"],["webapp","Home Screen link (experimental)"],["shortcut","Run Radio Grid Shortcut (slow)"]])methods.append(normalRow((state.returnMethod===key?"✓  ":"     ")+title,()=>{state.returnMethod=key;save();settingsHome();notify("Return method updated");}));
 body.append(methods,el("p","helper","A callback can reopen Radio Grid only after the selected Shortcut finishes. Website links may open Safari. The Home Screen link is unofficial and may not work on your iOS version."));
 body.append(group("Backup and restore"));const backup=el("div","group-box");backup.append(normalRow("Export settings as JSON",exportSettings),normalRow("Import settings from JSON",()=>$("importPicker").click()),normalRow("Restore original layout",resetDefaults,true));body.append(backup);
 body.append(el("p","helper",storageWorks?"Your changes are saved on this device and website origin. Export a backup before reinstalling or changing the web app address.":"Persistent browser storage is unavailable here. Export your configuration before closing."));
}
function miniButton(icon,description,fn,extra=""){const b=el("button","icon-btn "+extra);b.type="button";b.setAttribute("aria-label",description);b.title=description;b.append(svg(icon));if(fn)b.onclick=fn;return b;}
function addRow(label,fn){const b=el("button","plain-add");b.type="button";b.append(svg("plus"),el("span","",label));b.onclick=fn;return b;}
function swap(list,index,dir){const j=index+dir;if(j<0||j>=list.length)return;[list[index],list[j]]=[list[j],list[index]];changed("Order updated");}
function manager(){const previousScroll=$("sheetBody").scrollTop;shown="manage";const body=sheet("Edit Media","Back","Done",settingsHome,settingsHome);body.append(el("p","helper","Drag the dotted handles to reorder or move items between sections. Arrow controls also work."));
 const root=el("div","");root.id="manageRoot";
 state.sections.forEach((section,sindex)=>{
   const box=el("div","group-box manage-section");box.dataset.sectionId=section.id;
   const head=el("div","edit-row");const grip=miniButton("grip","Drag section",null,"handle");
   head.append(grip,iconFor(section.icon,"mini-icon"),el("div","edit-row-name",section.name));
   const up=miniButton("up","Move section up",()=>swap(state.sections,sindex,-1));up.disabled=!sindex;
   const down=miniButton("down","Move section down",()=>swap(state.sections,sindex,1));down.disabled=sindex===state.sections.length-1;
   head.append(up,down,miniButton("pencil","Edit section",()=>editSection(section.id)),miniButton("trash","Remove section",()=>deleteSection(section.id),"danger"));box.append(head);
   const items=el("div","manage-items");items.dataset.sectionId=section.id;
   section.items.forEach((item,i)=>{
     const row=el("div","edit-row manage-item");row.dataset.itemId=item.id;
     const handle=miniButton("grip","Drag "+item.name,null,"handle");const title=el("div","edit-row-name",item.name);
     title.append(el("span","edit-row-sub",item.action==="url"?"Direct link":"Shortcut"));
     row.append(handle,iconFor(item.icon,"mini-icon"),title);
     const u=miniButton("up","Move "+item.name+" up",()=>swap(section.items,i,-1));u.disabled=i===0;
     const d=miniButton("down","Move "+item.name+" down",()=>swap(section.items,i,1));d.disabled=i===section.items.length-1;
     row.append(u,d,miniButton("pencil","Edit button",()=>editButton(item.id)),miniButton("trash","Delete button",()=>deleteButton(item.id),"danger"));
     items.append(row);connectDrag(handle,row,"item");
   });
   box.append(items,addRow("Add Button",()=>editButton(null,section.id)));root.append(box);connectDrag(grip,box,"section");
 });
 body.append(root,addRow("Add Section",()=>editSection(null)));body.scrollTop=previousScroll;
}
function connectDrag(handle,row,kind){let pointer=null,changedOrder=false;
 handle.addEventListener("pointerdown",e=>{if(e.pointerType==="mouse"&&e.button!==0)return;pointer=e.pointerId;changedOrder=false;handle.setPointerCapture(pointer);row.classList.add("dragging");e.preventDefault();});
 handle.addEventListener("pointermove",e=>{
   if(pointer!==e.pointerId)return;
   const hit=document.elementFromPoint(e.clientX,e.clientY);if(!hit)return;
   if(kind==="section"){
     const dest=hit.closest(".manage-section");if(!dest||dest===row)return;
     const mid=dest.getBoundingClientRect();$("manageRoot").insertBefore(row,e.clientY<(mid.top+mid.height/2)?dest:dest.nextSibling);changedOrder=true;
   }else{
     const dest=hit.closest(".manage-item");
     if(dest&&dest!==row){const mid=dest.getBoundingClientRect();dest.parentNode.insertBefore(row,e.clientY<mid.top+mid.height/2?dest:dest.nextSibling);changedOrder=true;}
     else if(!dest){const parent=hit.closest(".manage-items")||hit.closest(".manage-section")?.querySelector(".manage-items");if(parent&&parent!==row.parentElement){parent.append(row);changedOrder=true;}}
   }
 });
 const end=e=>{if(pointer!==e.pointerId)return;pointer=null;row.classList.remove("dragging");if(changedOrder)syncOrder();};handle.addEventListener("pointerup",end);handle.addEventListener("pointercancel",end);
}
function syncOrder(){const root=$("manageRoot");if(!root)return;const sectionsById=new Map(state.sections.map(s=>[s.id,s]));const itemsById=new Map(state.sections.flatMap(s=>s.items.map(i=>[i.id,i])));
 const next=[];root.querySelectorAll(":scope > .manage-section").forEach(box=>{const section=sectionsById.get(box.dataset.sectionId);if(!section)return;section.items=[...box.querySelectorAll(":scope > .manage-items > .manage-item")].map(n=>itemsById.get(n.dataset.itemId)).filter(Boolean);next.push(section);});
 state.sections=next;changed("Reordered");
}
function deleteSection(id){const s=state.sections.find(v=>v.id===id);if(!s||!confirm("Delete ‘"+s.name+"’ and its "+s.items.length+" button(s)?"))return;state.sections=state.sections.filter(v=>v.id!==id);if(!state.sections.some(v=>v.id===state.active))state.active=state.sections[0]?.id||"";changed("Section deleted");}
function findItem(id){for(const s of state.sections){const i=s.items.find(v=>v.id===id);if(i)return {section:s,item:i};}return null;}
function deleteButton(id){const f=findItem(id);if(!f||!confirm("Delete ‘"+f.item.name+"’?"))return;f.section.items=f.section.items.filter(v=>v.id!==id);changed("Button deleted");}
function field(labelText,control){const row=el("div","field");const lab=el("label","",labelText);if(!control.id)control.id=uid();lab.htmlFor=control.id;row.append(lab,control);return row;}
function textInput(value,placeholder=""){const n=el("input");n.type="text";n.value=value||"";n.placeholder=placeholder;n.autocomplete="off";return n;}
function selectInput(options,value){const n=el("select");for(const [id,title] of options){const opt=el("option","",title);opt.value=id;n.append(opt);}n.value=value;return n;}
function checkRow(label,checked){const input=el("input");input.type="checkbox";input.checked=checked;const row=field(label,input);row.classList.add("check");return {row,input};}
function colorSelector(initial,onChange,inherit=false){const area=el("div","");const palette=el("div","palette");const buttons=[];let selected=initial||"";
 if(inherit){const b=el("button","swatch","↻");b.type="button";b.style.setProperty("--swatch","#454950");b.title="Use default orange";b.style.color="#fff";b.onclick=()=>{selected="";paint();onChange("");};palette.append(b);buttons.push([b,""]);}
 for(const c of PALETTE){const b=el("button","swatch");b.type="button";b.style.setProperty("--swatch",c);b.setAttribute("aria-label","Select "+c);b.onclick=()=>{selected=c;paint();onChange(c);};palette.append(b);buttons.push([b,c]);}
 function paint(){for(const [b,c] of buttons)b.classList.toggle("selected",selected.toLowerCase()===c.toLowerCase());}
 paint();area.append(palette);const inp=el("input");inp.type="color";inp.value=safeColor(initial)||DEFAULT_THEME.accent;inp.oninput=()=>{selected=inp.value;paint();onChange(inp.value);};area.append(field("Custom color",inp));return area;
}
function editSection(id){shown="section-form";const found=id?state.sections.find(s=>s.id===id):null;const body=sheet(found?"Edit Section":"New Section","Back","Save",manager,()=>saveForm.click());
 body.append(group("Section details"));const fields=el("div","field-set");const name=textInput(found?.name||"","Section name");const icon=selectInput(ICON_CHOICES,found?.icon||"broadcast");fields.append(field("Name",name),field("Icon",icon));body.append(fields);
 const error=el("div","error");body.append(error);const saveForm=el("button","save","Save Section");saveForm.type="button";saveForm.onclick=()=>{const val=name.value.trim();if(!val){error.textContent="Enter a section name.";name.focus();return;}
  if(found){found.name=val;found.icon=icon.value;}else{const section={id:uid(),name:val,icon:icon.value,items:[]};state.sections.push(section);if(!state.active)state.active=section.id;}
  changed("Section saved");manager();};body.append(saveForm);name.focus();
}
function editButton(id,sectionId){shown="button-form";const found=id?findItem(id):null;const current=found?.item||null;const body=sheet(current?"Edit Button":"New Button","Back","Save",manager,()=>saveForm.click());
 body.append(group("Button details"));const fields=el("div","field-set");const name=textInput(current?.name||"","Button label");const section=selectInput(state.sections.map(s=>[s.id,s.name]),found?.section.id||sectionId||state.sections[0]?.id);
 const action=selectInput([["shortcut","Run Shortcut"],["url","Open Link"]],current?.action||"shortcut");const target=textInput(current?.target||"","Exact Shortcut name");const icon=selectInput(ICON_CHOICES,current?.icon||"music");
 const targetRow=field("Shortcut",target);fields.append(field("Name",name),field("Section",section),field("Action",action),targetRow,field("Icon",icon));body.append(fields);
 body.append(group("Behavior"));const opt=el("div","field-set");const ret=checkRow("Return to Media when finished",!current?.noReturn);opt.append(ret.row);body.append(opt);
 const changeAction=()=>{const url=action.value==="url";targetRow.querySelector("label").textContent=url?"Link":"Shortcut";target.placeholder=url?"https://music.apple.com/…":"Exact Shortcut name";ret.row.hidden=url;};action.onchange=changeAction;changeAction();
 body.append(group("Button icon color"));let color=current?.color||"";body.append(colorSelector(color,v=>color=v,true));body.append(el("p","helper","↻ uses the default orange/gray icon coloring. A direct music link may open Apple Music without automatically playing."));
 const error=el("div","error");body.append(error);const saveForm=el("button","save","Save Button");saveForm.type="button";saveForm.onclick=()=>{
   const n=name.value.trim(),t=target.value.trim(),dest=state.sections.find(s=>s.id===section.value);
   if(!n){error.textContent="Enter a button name.";name.focus();return;}if(!t){error.textContent="Enter a Shortcut name or link.";target.focus();return;}
   if(action.value==="url"&&!/^(https?:|music:|podcasts:|spotify:|overcast:|x-apple-music:)/i.test(t)){error.textContent="Unsupported URL. Use an HTTPS or audio app link.";return;}
   if(!dest){error.textContent="Add a section first.";return;}
   const next={id:current?.id||uid(),name:n,icon:icon.value,action:action.value,target:t,noReturn:action.value==="shortcut"&&!ret.input.checked,color};
   if(found){const pos=found.section.items.findIndex(i=>i.id===id);found.section.items.splice(pos,1);if(found.section===dest)dest.items.splice(pos,0,next);else dest.items.push(next);}else dest.items.push(next);
   state.active=dest.id;changed("Button saved");manager();
 };body.append(saveForm);name.focus();
}
function editTheme(){shown="theme";const body=sheet("Change Colors","Back","Done",settingsHome,settingsHome);body.append(group("Accent color"));body.append(colorSelector(state.theme.accent,v=>{state.theme.accent=v;save();theme();render();}));
 body.append(group("Card and background colors"));const groupBox=el("div","field-set");
 for(const [key,label] of [["background","Background"],["surface","Cards (top)"],["surface2","Cards (bottom)"]]){const inp=el("input");inp.type="color";inp.value=state.theme[key];inp.oninput=()=>{state.theme[key]=inp.value;save();theme();};groupBox.append(field(label,inp));}
 body.append(groupBox,el("p","helper","Color changes save automatically. Settings sheet colors remain intentionally graphite for readability."));
 const reset=el("button","save","Reset Theme");reset.type="button";reset.onclick=()=>{state.theme=clone(DEFAULT_THEME);changed("Theme restored");editTheme();};body.append(reset);
}
function exportSettings(){const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});const url=URL.createObjectURL(blob);const a=el("a");a.href=url;a.download="Media-JT-Sport-Settings.json";document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);notify("Download requested");}
$("importPicker").onchange=async e=>{const file=e.target.files?.[0];if(!file)return;try{const data=normalise(JSON.parse(await file.text()));if(confirm("Replace current Media configuration with this backup?")){state=data;changed("Settings imported");settingsHome();}}catch(_){alert("Import failed. Choose a valid Media settings JSON file.");}finally{e.target.value="";}};
function resetDefaults(){if(!confirm("Restore all original sections, buttons, and colors? Export a backup first if needed."))return;state=defaults();changed("Defaults restored");settingsHome();}
// iOS Safari pinch-to-zoom prevention, while preserving one-finger scrolling.
["gesturestart","gesturechange","gestureend"].forEach(type=>document.addEventListener(type,e=>e.preventDefault(),{passive:false}));
document.addEventListener("touchmove",e=>{if(e.touches.length>1)e.preventDefault();},{passive:false});
$("openSettings").onclick=openSheet;$("scrim").onclick=closeSheet;
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("sheet").classList.contains("open")){if(shown==="home")closeSheet();else settingsHome();}});
theme();render();
</script>
</body>
