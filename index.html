<!-- V20: adaptive categories, native long-press menus, streamlined drag editing (retains V19 fixes) -->
<style>
  :root {

    --danger:#ff6961; --tab-r:16px; --card-r:13px;
    --card-width:100%; --card-outline-color:#777b83; --card-outline-width:1px;
    --card-gap-x:10px; --card-gap-y:10px;
    --app-font:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
    --title-font-size:32px; --title-font-weight:800; --title-font-style:normal;
    --button-font-size:20px; --button-font-weight:800; --button-font-style:normal; --card-text:#f3f4f5;
  }
  *,*::before,*::after { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { min-height:100%; background:var(--bg); touch-action:pan-x pan-y; }
  body {
    margin:0; height:100dvh; overflow:hidden; color:var(--text);
    font-family:var(--app-font);
    -webkit-font-smoothing:antialiased; overflow-x:hidden;
    background:radial-gradient(ellipse at 50% -30%, rgba(255,255,255,.06),transparent 56%),var(--bg);
  }
  [hidden] { display:none !important; }
  button,input,select { font:inherit; }
  button { cursor:pointer; color:inherit; border:0; -webkit-appearance:none; appearance:none; }
  button:focus-visible,input:focus-visible,select:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  /* Full-height app with one scrollable content region only when absolutely necessary. */
  .app { margin:auto; width:min(100%,760px); height:100dvh; display:flex; flex-direction:column; min-height:0;
    padding:max(8px,env(safe-area-inset-top)) 14px max(12px,env(safe-area-inset-bottom)); overflow:hidden; }
   .header { position:relative; flex:0 0 auto; display:flex; flex-direction:column;
    align-items:center; justify-content:center; height:76px; padding:4px 56px 7px; }
  .app-title { font-size:var(--title-font-size); font-weight:var(--title-font-weight); font-style:var(--title-font-style); line-height:1.08; letter-spacing:-.045em; margin:0; max-width:100%; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .subtitle { color:var(--muted); margin-top:8px; font-size:clamp(13px,3.4vw,18px); font-weight:480; letter-spacing:-.012em; white-space:nowrap; }
  .menu { position:absolute; right:0; top:50%; transform:translateY(-50%); width:48px; height:48px; display:grid; place-items:center; color:var(--accent); border-radius:15px; border:1px solid var(--line); background:linear-gradient(155deg,#25282d,#17191d); }
  .menu:active { filter:brightness(1.3); transform:translateY(-50%) scale(.97); }
  .menu svg { width:27px; height:27px; }
  /* Fixed, unscrollable category bar. Font is automatically fit to one line. */
  .tabs { flex:0 0 auto; display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:0;
    border-bottom:1px solid rgba(255,255,255,.11); margin:0 -14px 12px; padding:0 14px;
    overflow-x:hidden; touch-action:manipulation; }
  .tabs::-webkit-scrollbar { display:none; }
   .tab { min-width:0; position:relative; display:flex; flex-direction:column; align-items:center;
    justify-content:center; padding:13px 2px 15px; color:#a5aab2; background:transparent;
    font-size:15px; font-weight:700; text-align:center;
    white-space:nowrap; touch-action:manipulation; }
  .tab span { display:block; max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:clip; letter-spacing:-.025em; }
  .tab svg { display:none; }
  .tab.active { color:var(--accent); }
  .tab.active::after { content:""; position:absolute; bottom:0; left:8%; right:8%; height:4px; border-radius:6px 6px 0 0; background:var(--accent); }
  .tab:active { background:rgba(255,255,255,.035); }
  /* Full-width page strip tracks a finger drag and springs into place. */
  .page-track { width:100%; height:100%; display:flex; align-items:stretch;
    transform:translate3d(0,0,0); will-change:transform;
    transition:transform .34s cubic-bezier(.22,1,.36,1); }
  .page-slide { flex:0 0 100%; min-width:0; height:100%; overflow:hidden;
    touch-action:pan-y; overscroll-behavior-y:contain; -webkit-overflow-scrolling:touch; }
  .grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr));
    grid-auto-rows:var(--card-height,96px);
    column-gap:var(--card-gap-x); row-gap:var(--card-gap-y); align-content:start; }
  /* Uniform graphite text-only tiles, no illustrated icons */
  .card { min-width:0; width:var(--card-width); justify-self:center; height:100%; position:relative;
    display:flex; align-items:center; justify-content:center; text-align:center;
    padding:8px 8px; border-radius:var(--card-r);
    background:var(--card);
    border:var(--card-outline-width) solid var(--card-outline-color);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.08), 0 8px 20px rgba(0,0,0,.24);
    touch-action:pan-y; transition:transform .08s,filter .08s; }
  .card:active { transform:scale(.963); filter:brightness(1.18); }
  /* One shared font size for every button, including radio frequency and station name. */
  .card-label { min-width:0; max-height:100%; font-size:var(--button-font-size); font-weight:var(--button-font-weight); font-style:var(--button-font-style);
    line-height:1.14; letter-spacing:-.022em; color:var(--card-text); overflow-wrap:normal; word-break:normal;
    display:block; width:100%; }
  .card-label .frequency, .card-label .callsign { display:block; font:inherit; line-height:1.14; }
  .card-label .callsign { margin-top:3px; }
  .page-viewport { flex:1 1 auto; min-height:0; overflow:hidden;
    touch-action:pan-y; overscroll-behavior:contain; }
  .grid-empty { color:var(--muted); padding:18px 4px; grid-column:1/-1; text-align:center; }
  .section-note { margin:15px 4px; color:#888e99; text-align:center; font-size:12px; }

/* V16 – native grouped-list presentation */
.card-label{font-family:var(--button-font,var(--app-font));}
:root { --title-color:#f6f6f7; --pattern-image:none; --pattern-size:auto; --pattern-opacity:0; }
body { background:var(--bg); }
.app { position:relative; isolation:isolate; }
.app::before { content:""; position:absolute; inset:0; background-image:var(--pattern-image);background-size:var(--pattern-size);opacity:var(--pattern-opacity);pointer-events:none;z-index:0; }

.app-title { color:var(--title-color); }
.header { padding-left:66px; padding-right:66px; }
.header-action { position:absolute;top:50%;transform:translateY(-50%);height:46px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:14px;background:#22252a;color:var(--accent); }
.edit-home { left:0;min-width:61px;padding:0 12px;font-weight:700;font-size:16px; }
.menu {right:0;width:46px;height:46px;}

/* Modal structure behaves like iOS Settings navigation inside a web app. */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.57);opacity:0;pointer-events:none;transition:opacity .23s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:21;left:50%;bottom:0;transform:translate(-50%,105%);visibility:hidden;display:flex;flex-direction:column;width:min(100%,660px);height:min(94dvh,920px);max-height:94dvh;border-radius:24px 24px 0 0;background:#1b1c20;border:1px solid rgba(255,255,255,.10);border-bottom:0;box-shadow:0 -18px 60px #0009;transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility .28s;padding-bottom:env(safe-area-inset-bottom)}
.sheet.open{transform:translate(-50%,0);visibility:visible}
.grabber{flex:none;background:#696a72;width:37px;height:5px;border-radius:5px;margin:8px auto 0}
.sheet-head{display:grid;grid-template-columns:78px minmax(0,1fr) 78px;min-height:52px;align-items:center;padding:3px 15px 7px;border-bottom:1px solid #ffffff0c;flex:none}
.sheet-head h2{font-size:17px;font-weight:700;text-align:center;margin:0;letter-spacing:-.025em}

.sheet-action:last-child{text-align:right;font-weight:650}
.sheet-body{min-height:0;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;flex:1;padding:18px 15px max(30px,env(safe-area-inset-bottom));background:#1b1c20}
.sheet-body:focus{outline:none}
.settings-preview{flex:none;padding:8px 12px 10px;border-bottom:1px solid #ffffff10;background:#202127}
.settings-preview[hidden]{display:none!important}
.preview-caption{display:flex;align-items:center;justify-content:space-between;color:#9498a1;letter-spacing:.06em;font-size:10px;font-weight:650;padding:0 5px 5px;text-transform:uppercase}
.preview-stage{border:1px solid #ffffff15;border-radius:12px;background:#090a0b;display:flex;justify-content:center;overflow:hidden;padding:7px 0}
.preview-mini{position:relative;isolation:isolate;transform-origin:top left;flex:none;padding:9px 14px 6px;overflow:hidden;background:var(--bg)}
.preview-mini::before{content:"";position:absolute;inset:0;background-image:var(--pattern-image);background-size:var(--pattern-size);opacity:var(--pattern-opacity);z-index:0;pointer-events:none}
.preview-mini>*{position:relative;z-index:1}

.preview-mini .card{pointer-events:none}
/* Grouped Settings list system */
.ios-group-title{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.045em;color:#9799a2;margin:22px 10px 7px}

@media(max-width:365px){.ios-row-label{flex-basis:90px}.ios-row{padding:9px 10px}.ios-row-value{gap:6px}.ios-value{min-width:31px;font-size:11px}.organize-count{display:none}.org-btn{width:25px;min-width:25px}}

/* V17: unframed header controls and five-option iOS Settings landing page. */
.header .header-action,
.header .menu.header-action,
.header .edit-home {
  border:0 !important;
  border-radius:0 !important;
  background:transparent !important;
  background-image:none !important;
  box-shadow:none !important;

  -webkit-appearance:none;
  appearance:none;
}

 height:220px;

 overflow:hidden;
 overflow-anchor:none;

  background:#1b1c20;transform:translate3d(100%,0,0);opacity:1;visibility:visible;
  transition:transform .32s cubic-bezier(.25,.82,.3,1),filter .32s;pointer-events:none;will-change:transform}

// An edge swipe parallels iOS's interactive back gesture without consuming

function installNavBackSwipe(){
 const stack=$("navStack");
 stack.addEventListener("touchstart",e=>{
  navGesture=null;if(navHistory.length<=1||e.touches.length!==1)return;
  const t=e.touches[0];if(t.clientX>36||e.target.closest("input,select,button,textarea"))return;
  navGesture={x:t.clientX,y:t.clientY,dx:0,started:performance.now(),horizontal:false};
 },{passive:true});
 stack.addEventListener("touchmove",e=>{
  if(!navGesture||e.touches.length!==1)return;
  const g=navGesture,t=e.touches[0],dx=t.clientX-g.x,dy=t.clientY-g.y;
  if(!g.horizontal&&Math.abs(dy)>Math.abs(dx)*1.3&&Math.abs(dy)>12){navGesture=null;return;}
  if(dx>12&&dx>Math.abs(dy)*1.3)g.horizontal=true;
  if(!g.horizontal)return;
  if(e.cancelable)e.preventDefault();g.dx=Math.max(0,Math.min(dx,stack.clientWidth));
  const top=activeEntry()?.screen,prev=navHistory[navHistory.length-2]?.screen;
  if(!top||!prev)return;
  top.classList.add("is-dragging");prev.classList.add("is-dragging");
  top.style.transform=`translate3d(${g.dx}px,0,0)`;
  prev.style.transform=`translate3d(${-27+27*g.dx/Math.max(1,stack.clientWidth)}%,0,0)`;
 },{passive:false});
 const end=()=>{
  if(!navGesture)return;const g=navGesture;navGesture=null;
  const top=activeEntry()?.screen,prev=navHistory[navHistory.length-2]?.screen;
  if(top){top.style.transform="";top.classList.remove("is-dragging");}
  if(prev){prev.style.transform="";prev.classList.remove("is-dragging");}
  if(g.horizontal&&(g.dx>stack.clientWidth*.33||(g.dx>55&&g.dx/Math.max(1,performance.now()-g.started)>.55)))goBack();
 };
 stack.addEventListener("touchend",end,{passive:true});stack.addEventListener("touchcancel",end,{passive:true});
}

function enableDrag(handle,row,kind){

 };
 function animateNeighbors(before){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  for(const [node,prior] of before){
   if(!node.isConnected||node===row)continue;
   const now=node.getBoundingClientRect(),shift=prior.top-now.top;
   if(Math.abs(shift)>1&&Math.abs(shift)<450)
    node.animate([{transform:`translateY(${shift}px)`},{transform:"translateY(0)"}],{duration:180,easing:"cubic-bezier(.2,.8,.2,1)"});
  }
 }
 handle.addEventListener("pointerdown",e=>{
  if(pointer!==null||(e.pointerType==="mouse"&&e.button!==0))return;
  e.preventDefault();pointer=e.pointerId;startY=e.clientY;moved=false;
  // For an entire category, lift only its header to avoid covering the screen.
  const lift=kind==="section"?row.querySelector(".organize-header"):row;
  const rect=lift.getBoundingClientRect();
  ghost=lift.cloneNode(true);ghost.classList.add("drag-ghost");ghost.classList.remove("dragging");
  ghost.removeAttribute("id");ghost.setAttribute("aria-hidden","true");ghost.inert=true;
  ghost.style.cssText+=`;left:${rect.left}px;top:${rect.top}px;width:${rect.width}px;height:${rect.height}px`;
  document.body.append(ghost);row.classList.add("dragging");

   target=hit.closest(".organize-section:not(.dragging)");

   const targetHead=target.querySelector(".organize-header")?.getBoundingClientRect()||target.getBoundingClientRect();

   destination=$("hierarchyRoot");ref=beforeIt?target:target.nextSibling;

   // Work from the list's geometry instead of the element under the finger:
   // the lifted row and animated neighbors can otherwise cause end-of-list jumps.
   if(hit.closest(".organize-item.dragging"))return;
   const section=hit.closest(".organize-section");
   destination=section?.querySelector(".organize-items")||null;
   if(!destination)return;
   const siblings=[...destination.querySelectorAll(":scope > .organize-item:not(.dragging)")];
   ref=siblings.find(n=>e.clientY<n.getBoundingClientRect().top+n.offsetHeight/2)||null;
   target=ref||siblings[siblings.length-1]||null;
   beforeIt=!!ref;
  }
  if(!destination)return;
  clearHighlight();
  highlighted=target||destination;
  highlighted.classList.add(target?(beforeIt?"drop-before":"drop-after"):"drop-into");
  if(destination===row.parentNode&&(ref===row||ref===row.nextSibling))return;
  const candidates=[...$("hierarchyRoot").querySelectorAll(kind==="section"?":scope > .organize-section":".organize-item")];

}

function iosConfirm(title,message,destructiveLabel="Continue"){
 return new Promise(resolve=>{
  const old=document.querySelector(".confirm-overlay");old?.remove();
  const overlay=el("div","confirm-overlay");overlay.setAttribute("role","alertdialog");overlay.setAttribute("aria-modal","true");
  overlay.setAttribute("aria-label",title);
  const panel=el("div","confirm-panel"),info=el("div","confirm-info");
  const heading=el("h3","",title),paragraph=el("p","",message);
  const destructive=el("button","",destructiveLabel);destructive.type="button";
  const cancel=el("button","confirm-cancel","Cancel");cancel.type="button";
  info.append(heading,paragraph,destructive);panel.append(info,cancel);overlay.append(panel);document.body.append(overlay);
  const focus=document.activeElement;
  const finish=value=>{overlay.remove();focus?.focus?.({preventScroll:true});resolve(value);};
  destructive.onclick=()=>finish(true);cancel.onclick=()=>finish(false);
  overlay.addEventListener("click",e=>{if(e.target===overlay)finish(false);});
  overlay.addEventListener("keydown",e=>{if(e.key==="Escape"){e.preventDefault();finish(false);}
   if(e.key==="Tab"){e.preventDefault();(document.activeElement===cancel?destructive:cancel).focus();}});
  requestAnimationFrame(()=>{overlay.classList.add("open");cancel.focus({preventScroll:true});});
 });
}
