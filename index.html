<style>
  :root {

    margin:0; height:100dvh; overflow:hidden; color:var(--text);

  }
  [hidden] { display:none !important; }
  button,input,select { font:inherit; }
  button { cursor:pointer; color:inherit; border:0; -webkit-appearance:none; appearance:none; }
  button:focus-visible,input:focus-visible,select:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  /* Full-height app with one scrollable content region only when absolutely necessary. */
  .app { margin:auto; width:min(100%,760px); height:100dvh; display:flex; flex-direction:column; min-height:0;
    padding:max(8px,env(safe-area-inset-top)) 14px max(12px,env(safe-area-inset-bottom)); overflow:hidden; }
   .header { position:relative; flex:0 0 auto; display:flex; flex-direction:column;
    align-items:center; justify-content:center; height:76px; padding:4px 56px 7px; }
  .app-title { font-size:var(--title-font-size); font-weight:var(--title-font-weight); font-style:var(--title-font-style); line-height:1.08; letter-spacing:-.045em; margin:0; max-width:100%; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .subtitle { color:var(--muted); margin-top:8px; font-size:clamp(13px,3.4vw,18px); font-weight:480; letter-spacing:-.012em; white-space:nowrap; }
  .menu { position:absolute; right:0; top:50%; transform:translateY(-50%); width:48px; height:48px; display:grid; place-items:center; color:var(--accent); border-radius:15px; border:1px solid var(--line); background:linear-gradient(155deg,#25282d,#17191d); }
  .menu:active { filter:brightness(1.3); transform:translateY(-50%) scale(.97); }
  .menu svg { width:27px; height:27px; }
  /* Fixed, unscrollable category bar. Font is automatically fit to one line. */
  .tabs { flex:0 0 auto; display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:0;
    border-bottom:1px solid rgba(255,255,255,.11); margin:0 -14px 12px; padding:0 14px;
    overflow-x:hidden; touch-action:manipulation; }
  .tabs::-webkit-scrollbar { display:none; }
   .tab { min-width:0; position:relative; display:flex; flex-direction:column; align-items:center;
    justify-content:center; padding:13px 2px 15px; color:#a5aab2; background:transparent;
    font-size:15px; font-weight:700; text-align:center;
    white-space:nowrap; touch-action:manipulation; }
  .tab span { display:block; max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:clip; letter-spacing:-.025em; }
  .tab svg { display:none; }
  .tab.active { color:var(--accent); }
  .tab.active::after { content:""; position:absolute; bottom:0; left:8%; right:8%; height:4px; border-radius:6px 6px 0 0; background:var(--accent); }
  .tab:active { background:rgba(255,255,255,.035); }
  /* Full-width page strip tracks a finger drag and springs into place. */
  .page-track { width:100%; height:100%; display:flex; align-items:stretch;
    transform:translate3d(0,0,0); will-change:transform;
    transition:transform .34s cubic-bezier(.22,1,.36,1); }
  :root { --page-swipe-gutter:12px; }

    padding-left:var(--page-swipe-gutter); padding-right:var(--page-swipe-gutter);
    touch-action:pan-y; overscroll-behavior-y:contain; -webkit-overflow-scrolling:touch; }
  .grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr));
    grid-auto-rows:var(--card-height,96px);
    column-gap:var(--card-gap-x); row-gap:var(--card-gap-y); align-content:start; }
  /* Uniform graphite text-only tiles, no illustrated icons */
  .card { min-width:0; width:var(--card-width); justify-self:center; height:100%; position:relative;
    display:flex; align-items:center; justify-content:center; text-align:center;
    padding:8px 8px; border-radius:var(--card-r);
    background:var(--card);
    border:var(--card-outline-width) solid var(--card-outline-color);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.08), 0 8px 20px rgba(0,0,0,.24);
    touch-action:pan-y; transition:transform .08s,filter .08s; }
  .card:active { transform:scale(.963); filter:brightness(1.18); }
  /* One shared font size for every button, including radio frequency and station name. */
  .card-label { min-width:0; max-height:100%; font-size:var(--button-font-size); font-weight:var(--button-font-weight); font-style:var(--button-font-style);
    line-height:1.14; letter-spacing:-.022em; color:var(--card-text); overflow-wrap:normal; word-break:normal;
    display:block; width:100%; }
  .card-label .frequency, .card-label .callsign { display:block; font:inherit; line-height:1.14; }
  .card-label .callsign { margin-top:3px; }
  .page-viewport { flex:1 1 auto; min-height:0; overflow:hidden;
    touch-action:pan-y; overscroll-behavior:contain; }
  .grid-empty { color:var(--muted); padding:18px 4px; grid-column:1/-1; text-align:center; }
  .section-note { margin:15px 4px; color:#888e99; text-align:center; font-size:12px; }

function normalizeSections(source){
 if(!Array.isArray(source)||source.length>40)throw Error("Invalid sections");
 const ids=new Set();
 return source.map(s=>{
   if(!s||typeof s.name!=="string"||!Array.isArray(s.items)||s.items.length>150)throw Error("Invalid section");
   const id=String(s.id||uid());if(ids.has(id))throw Error("Duplicate id");ids.add(id);
   return {id,name:s.name.trim().slice(0,50)||"Untitled",icon:ICONS[s.icon]?s.icon:inferSectionIcon(id),items:s.items.map(i=>{
     if(!i||typeof i.name!=="string")throw Error("Invalid item");
     const iid=String(i.id||uid());if(ids.has(iid))throw Error("Duplicate id");ids.add(iid);
     return {id:iid,name:i.name.trim().slice(0,80)||"Untitled",secondaryLabel:typeof i.secondaryLabel==="string"?i.secondaryLabel.trim().slice(0,50):"",icon:ICONS[i.icon]?i.icon:inferItemIcon(i.name),action:i.action==="url"?"url":"shortcut",target:String(i.target||"").slice(0,2000),noReturn:!!i.noReturn,color:safeColor(i.color)||""};
   })};
 });

function inferSectionIcon(id){return id==="podcasts"?"podcast":id==="radio"?"radio":"broadcast";}
function inferItemIcon(name){const n=String(name).toLowerCase();if(n.includes("bible"))return "book";if(n.includes("ksr"))return "mic";if(n.includes("rock"))return "rock";if(n.includes("coffee"))return "coffee";if(n.includes("americana"))return "guitar";if(n.includes("wuky"))return "tower";return "music";}

 if(!data||typeof data!=="object")throw Error("Invalid backup");
 const sections=normalizeSections(data.sections);

 const active=sections.some(s=>s.id===data.active)?data.active:sections[0]?.id||"";

 return {sections,active,theme:{accent:safeColor(theme.accent)||DEFAULT_THEME.accent,background:safeColor(theme.background)||safeColor(theme.bg)||DEFAULT_THEME.background,surface:safeColor(theme.surface)||safeColor(theme.panel)||DEFAULT_THEME.surface,surface2:safeColor(theme.surface2)||safeColor(theme.panel2)||DEFAULT_THEME.surface2,card:safeColor(theme.card)||DEFAULT_THEME.card,buttonText:safeColor(theme.buttonText)||DEFAULT_THEME.buttonText,titleColor:safeColor(theme.titleColor)||DEFAULT_THEME.titleColor,pattern:["none","terrain","carbon","grid","brushed","glow"].includes(theme.pattern)?theme.pattern:"none"},returnMethod:data.returnMethod==="webapp"?"webapp":data.returnMethod==="shortcut"?"shortcut":"website",appTitle:customTitle||DEFAULT_APP_TITLE,fontStyle,buttonFontStyle:Object.hasOwn(FONT_STACKS,data.buttonFontStyle)?data.buttonFontStyle:fontStyle,

   categoryItalic:typeof data.categoryItalic==="boolean"?data.categoryItalic:DEFAULT_CATEGORY_STYLE.categoryItalic,
   categoryTextColor:safeColor(data.categoryTextColor)||DEFAULT_CATEGORY_STYLE.categoryTextColor,
   categoryActiveColor:safeColor(data.categoryActiveColor)||"",
   categoryUnderlineColor:safeColor(data.categoryUnderlineColor)||"",
   categoryUnderlineHeight:clampNumber(data.categoryUnderlineHeight,2,7,DEFAULT_CATEGORY_STYLE.categoryUnderlineHeight),
   buttonBold:typeof data.buttonBold==="boolean"?data.buttonBold:DEFAULT_TYPOGRAPHY.buttonBold,
   buttonItalic:typeof data.buttonItalic==="boolean"?data.buttonItalic:DEFAULT_TYPOGRAPHY.buttonItalic,

     outlineColor:safeColor(data.buttonStyle?.outlineColor)||DEFAULT_BUTTON_STYLE.outlineColor,
     outlineWidth:clampNumber(data.buttonStyle?.outlineWidth,0,4,DEFAULT_BUTTON_STYLE.outlineWidth),

}
let state=defaults(),storageWorks=false,shown="home",lastFocus=null,toastTimer=null;
let storageFailure="",unreadableSettings="",migratedFromLegacy=false;

// Never confuse a malformed saved file with an unavailable storage API.
try{

  try{state=normalise(JSON.parse(saved));}
  catch(e){unreadableSettings=saved;storageFailure="Existing local settings could not be read. Export the unreadable data or restore a backup before making changes.";}
 }else{
  for(const legacy of LEGACY){
   const raw=localStorage.getItem(legacy);if(!raw)continue;
   try{const obj=JSON.parse(raw);state=normalise(Array.isArray(obj)?{sections:obj,active:"podcasts",theme:DEFAULT_THEME}:obj);migratedFromLegacy=true;break;}
   catch(e){storageFailure="An older saved layout could not be read. You may import an earlier backup.";}
  }
 }
}catch(e){storageWorks=false;storageFailure="Browser storage is unavailable in this view. Changes last only while this page remains open.";state=defaults();}
// Preserve existing customized buttons while restoring the Playlists tab.
// Existing older builds stored these same playlist buttons in a group called Stations.
function restorePlaylists(){
 const hasPlaylists=state.sections.some(x=>x.id==="playlists"||x.name.toLowerCase()==="playlists");
 if(hasPlaylists)return;
 const former=state.sections.find(x=>x.id==="stations"||x.name.toLowerCase()==="stations");
 if(!former)return;
 const oldId=former.id;
 former.id="playlists";former.name="Playlists";
 if(state.active===oldId)state.active="playlists";
 try { if(storageWorks)localStorage.setItem(KEY,JSON.stringify(state)); } catch(_){}
}
// Upgrade existing saved V6/V7 layouts to four standard categories without
// overwriting custom buttons, destinations, colors, or user-created categories.
function restoreFourCategories(){
 const standards=[
  {id:"podcasts",name:"Podcasts"},
  {id:"apple-music",name:"Apple Music"},
  {id:"playlists",name:"Playlists"},
  {id:"radio",name:"Radio"}
 ];
 const remaining=[...state.sections];
 const arranged=[];
 for(const {id,name} of standards){
  let index=remaining.findIndex(s=>s.id===id);
  if(index<0)index=remaining.findIndex(s=>s.name.toLowerCase()===name.toLowerCase());
  if(index>=0){
   const existing=remaining.splice(index,1)[0];
   existing.name=name;
   arranged.push(existing);
  }else{
   const base=DEFAULT_SECTIONS.find(s=>s.id===id);
   // Do not duplicate any shortcut if it already exists in a customized group.
   const existingTargets=new Set(state.sections.flatMap(s=>s.items.map(i=>i.target)));
   const copy=clone(base);
   copy.items=copy.items.filter(i=>!existingTargets.has(i.target));
   arranged.push(copy);
  }
 }
 // User-added sections are preserved rather than silently deleted.
 state.sections=[...arranged,...remaining];
 if(!state.sections.some(s=>s.id===state.active))state.active="podcasts";
 try{if(storageWorks)localStorage.setItem(KEY,JSON.stringify(state));}catch(_){}
}
// Only migrate a layout imported from a LEGACY storage key.
// Never force-add default categories on subsequent launches: deletions must persist.
if(migratedFromLegacy){
 restorePlaylists();
 restoreFourCategories();
}
function save(){
 // Do not overwrite an unreadable saved file merely because the user switched tabs.
 // A confirmed restore or reset must explicitly clear this recovery guard.
 if(unreadableSettings)return false;
 if(!storageWorks)return false;
 try{localStorage.setItem(KEY,JSON.stringify(state));storageFailure="";unreadableSettings="";return true;}
 catch(e){storageWorks=false;storageFailure="Browser storage could not save this configuration. Export a backup before leaving.";return false;}
}

 heading.style.fontSize=size+"px";
 while(size>17 && heading.scrollWidth>available){size-=1;heading.style.fontSize=size+"px";}
}

 b.append(sectionLabel("Button Label"),grouped(settingRow("Button Name",name),settingRow("Second Line",secondary)));
 b.append(el("p","ios-help","The optional second line appears beneath the main name. It does not change the Shortcut being run."));
 b.append(sectionLabel("Action"),grouped(settingRow("Category",sec),settingRow("Action",type),targetRow,retRow));
 const error=el("p","edit-error");b.append(error);
 if(item){const del=el("button","edit-danger","Delete Button");del.type="button";del.onclick=()=>deleteHomeButton(id);b.append(del);}
 const save=()=>{
  const label=name.value.trim(),dest=state.sections.find(s=>s.id===sec.value),link=target.value.trim();
  if(!label||!dest||!link){error.textContent="Enter a name, category, and destination.";return;}
  if(type.value==="url"&&!/^(https?:|music:|podcasts:|spotify:|overcast:|x-apple-music:)/i.test(link)){
   error.textContent="Enter a valid URL or supported audio link.";return;
  }
  const next={id:item?.id||uid(),name:label,secondaryLabel:secondary.value.trim().slice(0,50),icon:item?.icon||"music",action:type.value,target:link,
   noReturn:type.value==="shortcut"&&!ret.checked,color:item?.color||""};
  if(found){const oldIndex=found.sec.items.findIndex(i=>i.id===id);found.sec.items.splice(oldIndex,1);
   if(found.sec===dest)dest.items.splice(oldIndex,0,next);else dest.items.push(next);
  }else dest.items.push(next);
  state.active=dest.id;closeHomeEditor();persistHomeEdit(item?"Button updated":"Button added");
 };
 v.saveBtn.onclick=save;
 b.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.tagName==="INPUT"&&e.target.type==="text"){e.preventDefault();save();}});
}
function moveHomeCategory(id,direction){
 const old=state.sections.findIndex(s=>s.id===id);
 const next=old+direction;
 if(old<0||next<0||next>=state.sections.length)return;
 [state.sections[old],state.sections[next]]=[state.sections[next],state.sections[old]];
 closeHomeEditor();save();render();
 const selected=$("tabs").querySelector(`.edit-tab-wrap[data-section-id="${CSS.escape(id)}"] .edit-tab-tool`);
 selected?.focus({preventScroll:true});
}
function openCategoryActions(id){
 const section=state.sections.find(s=>s.id===id);if(!section)return;
 const v=buildHomeEditor("Category Options","Done");v.saveBtn.onclick=closeHomeEditor;
 v.body.append(sectionLabel(section.name));
 const index=state.sections.indexOf(section);
 const rename=navigationRow("Rename Category","",()=>openCategoryEditor(id));
 const left=navigationRow("Move Left","",()=>moveHomeCategory(id,-1));left.disabled=index===0;
 const right=navigationRow("Move Right","",()=>moveHomeCategory(id,1));right.disabled=index===state.sections.length-1;
 const remove=navigationRow("Delete Category","",()=>deleteHomeCategory(id));
 remove.classList.add("v33-destructive");
 v.body.append(grouped(rename,left,right,remove));
 v.body.append(el("p","ios-help","Select a category tab to switch categories. Use these actions to rename or change its order."));
}
function openCategoryEditor(id){
 const sec=id?state.sections.find(s=>s.id===id):null;
 const v=buildHomeEditor(sec?"Edit Category":"New Category"),b=v.body;
 const name=textControl(sec?.name||"","Category name");name.maxLength=50;
 b.append(sectionLabel("Category"),grouped(settingRow("Name",name)));
 b.append(el("p","ios-help","To change the category order, select its tab and use Category Options."));
 const error=el("p","edit-error");b.append(error);
 if(sec){
  const del=el("button","edit-danger","Delete Category");del.type="button";
  del.onclick=()=>deleteHomeCategory(sec.id);b.append(del);
 }
 const save=()=>{
  const label=name.value.trim();if(!label){error.textContent="Enter a category name.";return;}
  if(sec)sec.name=label;else{const next={id:uid(),name:label,icon:"broadcast",items:[]};state.sections.push(next);state.active=next.id;}
  closeHomeEditor();persistHomeEdit(sec?"Category renamed":"Category added");
 };
 v.saveBtn.onclick=save;
 name.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();save();}});
}
async function deleteHomeButton(id){
 const f=findButton(id);if(!f)return;
 if(!await iosConfirm("Delete Button?",`Delete “${f.item.name}”?`,"Delete Button"))return;
 const before=clone(state);f.sec.items=f.sec.items.filter(x=>x.id!==id);
 closeHomeEditor();persistHomeEdit("");offerUndo("Button deleted",before);
}
async function deleteHomeCategory(id){
 const sec=state.sections.find(s=>s.id===id);if(!sec)return;
 if(state.sections.length<=1){notify("Keep at least one category");return;}
 if(!await iosConfirm("Delete Category?",`Delete “${sec.name}” and its ${sec.items.length} buttons?`,"Delete Category"))return;
 const before=clone(state);state.sections=state.sections.filter(s=>s.id!==id);
 if(state.active===id)state.active=state.sections[0]?.id||"";
 closeHomeEditor();persistHomeEdit("");offerUndo("Category deleted",before);
}

theme();render();installCategorySwipe();installNavBackSwipe();
</script>
</body>
</html>
