   const id=String(s.id||uid());if(ids.has(id))throw Error("Duplicate id");ids.add(id);
   return {id,name:s.name.trim().slice(0,50)||"Untitled",icon:ICONS[s.icon]?s.icon:inferSectionIcon(id),items:s.items.map(i=>{
     if(!i||typeof i.name!=="string")throw Error("Invalid item");
     const iid=String(i.id||uid());if(ids.has(iid))throw Error("Duplicate id");ids.add(iid);
     return {id:iid,name:i.name.trim().slice(0,80)||"Untitled",icon:ICONS[i.icon]?i.icon:inferItemIcon(i.name),action:i.action==="url"?"url":"shortcut",target:String(i.target||"").slice(0,2000),noReturn:!!i.noReturn,color:safeColor(i.color)||""};
   })};
 });
}

function inferItemIcon(name){const n=String(name).toLowerCase();if(n.includes("bible"))return "book";if(n.includes("ksr"))return "mic";if(n.includes("rock"))return "rock";if(n.includes("coffee"))return "coffee";if(n.includes("americana"))return "guitar";if(n.includes("wuky"))return "tower";return "music";}
const defaults=()=>({sections:clone(DEFAULT_SECTIONS),active:"podcasts",theme:clone(DEFAULT_THEME),returnMethod:"website"});
function normalise(data){

 const sections=normalizeSections(data.sections);
 const theme=data.theme||{};
 const active=sections.some(s=>s.id===data.active)?data.active:sections[0]?.id||"";
 return {sections,active,theme:{accent:safeColor(theme.accent)||DEFAULT_THEME.accent,background:safeColor(theme.background)||safeColor(theme.bg)||DEFAULT_THEME.background,surface:safeColor(theme.surface)||safeColor(theme.panel)||DEFAULT_THEME.surface,surface2:safeColor(theme.surface2)||safeColor(theme.panel2)||DEFAULT_THEME.surface2,card:safeColor(theme.card)||DEFAULT_THEME.card},returnMethod:data.returnMethod==="webapp"?"webapp":data.returnMethod==="shortcut"?"shortcut":"website"};

let state=defaults(),storageWorks=false,shown="home",lastFocus=null,toastTimer=null;

 else {
   for(const legacy of LEGACY){const v=localStorage.getItem(legacy);if(!v)continue;
     const obj=JSON.parse(v);state=normalise(Array.isArray(obj)?{sections:obj,active:"podcasts",theme:DEFAULT_THEME}:obj);break;
   }
 }

   const b=el("button","tab"+(activeSection()?.id===section.id?" active":""));b.type="button";b.setAttribute("aria-current",activeSection()?.id===section.id?"page":"false");b.append(el("span","",section.name));

// Whole-page gestures: swiping on a media card, the empty page, or the
// surrounding layout changes category. A normal tap still plays the item.
// Vertical scroll gestures and the settings sheet remain unaffected.
let suppressCardClickUntil=0;
let pageTouch=null;
function installCategorySwipe(){
  const page=$('pageViewport');
  const app=document.querySelector('.app');
  // Capture on the document so nested buttons do not swallow the gesture.
  // Do not attach only to the grid: swipes in blank page space work too.
  document.addEventListener('touchstart',event=>{
    pageTouch=null;
    if(event.touches.length!==1 || $('sheet').classList.contains('open'))return;
    const target=event.target instanceof Element ? event.target : event.target?.parentElement;
    if(!target?.closest('.app') || target.closest('#openSettings'))return;
    const finger=event.touches[0];
    pageTouch={id:finger.identifier,x:finger.clientX,y:finger.clientY,dx:0,dy:0,axis:null};
  },{capture:true,passive:true});
  document.addEventListener('touchmove',event=>{
    const gesture=pageTouch;
    if(!gesture)return;
    if(event.touches.length!==1){pageTouch=null;return;}
    const finger=Array.from(event.touches).find(t=>t.identifier===gesture.id);
    if(!finger){pageTouch=null;return;}
    gesture.dx=finger.clientX-gesture.x;
    gesture.dy=finger.clientY-gesture.y;
    const ax=Math.abs(gesture.dx),ay=Math.abs(gesture.dy);
    if(!gesture.axis && (ax>13 || ay>13)){
      gesture.axis=ax>ay*1.22 ? 'horizontal' : (ay>ax*1.12 ? 'vertical' : null);
    }
    if(gesture.axis==='horizontal'){
      // Touch action on cards is pan-y to keep horizontal moves in the page.
      if(event.cancelable)event.preventDefault();
      suppressCardClickUntil=performance.now()+500;
    }
  },{capture:true,passive:false});
  document.addEventListener('touchend',event=>{
    const gesture=pageTouch;
    if(!gesture)return;
    const finger=Array.from(event.changedTouches).find(t=>t.identifier===gesture.id);
    if(!finger)return;
    pageTouch=null;
    // Capture the final finger position even for very quick flicks.
    gesture.dx=finger.clientX-gesture.x;
    gesture.dy=finger.clientY-gesture.y;
    const ax=Math.abs(gesture.dx),ay=Math.abs(gesture.dy);
    if((gesture.axis!=='horizontal' && !(ax>25 && ax>ay*1.22)) ||
       ax<Math.max(48,Math.min(75,app.clientWidth*.13)) || ax<ay*1.22)return;
    suppressCardClickUntil=performance.now()+500;
    const index=state.sections.findIndex(section=>section.id===activeSection()?.id);
    const direction=gesture.dx<0?1:-1;
    const destination=state.sections[index+direction];
    if(!destination)return;
    state.active=destination.id;
    save();
    render(direction);
  },{capture:true,passive:true});
  document.addEventListener('touchcancel',()=>{pageTouch=null;},{capture:true,passive:true});
}
function returnURL(){
 if(state.returnMethod==="shortcut"||!/^https?:$/.test(location.protocol))return "shortcuts://run-shortcut?name="+encodeURIComponent("Radio Grid");
 const url=new URL(location.href);url.hash="";url.searchParams.delete("result");url.searchParams.delete("errorMessage");
 return state.returnMethod==="webapp"?"webapp://"+url.host+url.pathname+url.search:url.href;
}
function run(item){
 if(item.action==="url"){
   if(!/^(https?:|music:|podcasts:|spotify:|overcast:|x-apple-music:)/i.test(item.target)){notify("Invalid link. Edit this button.");return;}
   location.href=item.target;return;
 }
 if(!item.target?.trim()){notify("Missing Shortcut name");return;}
 const base="shortcuts://run-shortcut?name="+encodeURIComponent(item.target);
 if(item.noReturn){location.href=base;return;}
 const ret=returnURL();
 location.href="shortcuts://x-callback-url/run-shortcut?name="+encodeURIComponent(item.target)+"&x-success="+encodeURIComponent(ret)+"&x-cancel="+encodeURIComponent(ret)+"&x-error="+encodeURIComponent(ret);
}

// Everything is editable from this single, scrollable Settings sheet.
function settingsHome(preserveScroll=false){
 const bodyEl=$("sheetBody");

 shown="home";

 $("sheetBack").style.visibility="hidden";

 });
 body.append(root);
 const newHost=el("div","editor-host");
 body.append(addRow("Add Section",()=>showSectionEditor(null,newHost)),newHost);
 body.append(group("Appearance"));
 const colors=el("div","field-set");
 for(const [key,label] of [["accent","Accent orange"],["card","Button gray"],["background","Background"]]){
   const input=el("input");input.type="color";input.value=state.theme[key]||DEFAULT_THEME[key];
   input.oninput=()=>{state.theme[key]=input.value;save();theme();render();};
   colors.append(field(label,input));
 }
 body.append(colors,normalRow("Restore original colors",()=>{state.theme=clone(DEFAULT_THEME);changed("Colors restored");}));
 body.append(group("Return after playing"));
 const method=selectInput([["website","Website link"],["webapp","Home Screen app (experimental)"],["shortcut","Launch Radio Grid Shortcut"]],state.returnMethod);
 method.onchange=()=>{state.returnMethod=method.value;save();notify("Return method saved");};
 const ret=el("div","field-set");ret.append(field("Method",method));body.append(ret);
 body.append(el("p","helper","The callback runs after the selected Shortcut finishes. A website link may open in Safari; the Home Screen option is unofficial."));
 body.append(group("Backup & Restore"));
 const backups=el("div","group-box");backups.append(normalRow("Export settings as JSON",exportSettings),normalRow("Import settings from JSON",()=>$('importPicker').click()),normalRow("Restore original layout",resetDefaults,true));body.append(backups);
 body.append(el("p","helper",storageWorks?"Changes are saved locally for this web app. Export a backup before changing the website address or reinstalling.":"Browser storage is unavailable; export a backup before leaving."));
 body.scrollTop=scroll;

function miniButton(icon,description,fn,extra=""){const b=el("button","icon-btn "+extra);b.type="button";b.setAttribute("aria-label",description);b.title=description;b.append(svg(icon));if(fn)b.onclick=fn;return b;}
function addRow(label,fn){const b=el("button","plain-add");b.type="button";b.append(svg("plus"),el("span","",label));b.onclick=fn;return b;}
function swap(list,index,dir){const j=index+dir;if(j<0||j>=list.length)return;[list[index],list[j]]=[list[j],list[index]];changed("Order updated");}
function connectDrag(handle,row,kind){let pointer=null,changedOrder=false;
 handle.addEventListener("pointerdown",e=>{if(e.pointerType==="mouse"&&e.button!==0)return;pointer=e.pointerId;changedOrder=false;handle.setPointerCapture(pointer);row.classList.add("dragging");e.preventDefault();});
 handle.addEventListener("pointermove",e=>{
   if(pointer!==e.pointerId)return;
   const hit=document.elementFromPoint(e.clientX,e.clientY);if(!hit)return;
   if(kind==="section"){
     const dest=hit.closest(".manage-section");if(!dest||dest===row)return;
     const mid=dest.getBoundingClientRect();$("manageRoot").insertBefore(row,e.clientY<(mid.top+mid.height/2)?dest:dest.nextSibling);changedOrder=true;
   }else{
     const dest=hit.closest(".manage-item");
     if(dest&&dest!==row){const mid=dest.getBoundingClientRect();dest.parentNode.insertBefore(row,e.clientY<mid.top+mid.height/2?dest:dest.nextSibling);changedOrder=true;}
     else if(!dest){const parent=hit.closest(".manage-items")||hit.closest(".manage-section")?.querySelector(".manage-items");if(parent&&parent!==row.parentElement){parent.append(row);changedOrder=true;}}
   }
 });
 const end=e=>{if(pointer!==e.pointerId)return;pointer=null;row.classList.remove("dragging");if(changedOrder)syncOrder();};handle.addEventListener("pointerup",end);handle.addEventListener("pointercancel",end);
}
function syncOrder(){const root=$("manageRoot");if(!root)return;const sectionsById=new Map(state.sections.map(s=>[s.id,s]));const itemsById=new Map(state.sections.flatMap(s=>s.items.map(i=>[i.id,i])));
 const next=[];root.querySelectorAll(":scope > .manage-section").forEach(box=>{const section=sectionsById.get(box.dataset.sectionId);if(!section)return;section.items=[...box.querySelectorAll(":scope > .manage-items > .manage-item")].map(n=>itemsById.get(n.dataset.itemId)).filter(Boolean);next.push(section);});
 state.sections=next;changed("Reordered");
}
function deleteSection(id){const s=state.sections.find(v=>v.id===id);if(!s||!confirm("Delete ‘"+s.name+"’ and its "+s.items.length+" button(s)?"))return;state.sections=state.sections.filter(v=>v.id!==id);if(!state.sections.some(v=>v.id===state.active))state.active=state.sections[0]?.id||"";changed("Section deleted");}
function findItem(id){for(const s of state.sections){const i=s.items.find(v=>v.id===id);if(i)return {section:s,item:i};}return null;}
function deleteButton(id){const f=findItem(id);if(!f||!confirm("Delete ‘"+f.item.name+"’?"))return;f.section.items=f.section.items.filter(v=>v.id!==id);changed("Button deleted");}
function field(labelText,control){const row=el("div","field");const lab=el("label","",labelText);if(!control.id)control.id=uid();lab.htmlFor=control.id;row.append(lab,control);return row;}
function textInput(value,placeholder=""){const n=el("input");n.type="text";n.value=value||"";n.placeholder=placeholder;n.autocomplete="off";return n;}
function selectInput(options,value){const n=el("select");for(const [id,title] of options){const opt=el("option","",title);opt.value=id;n.append(opt);}n.value=value;return n;}
function checkRow(label,checked){const input=el("input");input.type="checkbox";input.checked=checked;const row=field(label,input);row.classList.add("check");return {row,input};}
function colorSelector(initial,onChange,inherit=false){const area=el("div","");const palette=el("div","palette");const buttons=[];let selected=initial||"";
 if(inherit){const b=el("button","swatch","↻");b.type="button";b.style.setProperty("--swatch","#454950");b.title="Use default orange";b.style.color="#fff";b.onclick=()=>{selected="";paint();onChange("");};palette.append(b);buttons.push([b,""]);}
 for(const c of PALETTE){const b=el("button","swatch");b.type="button";b.style.setProperty("--swatch",c);b.setAttribute("aria-label","Select "+c);b.onclick=()=>{selected=c;paint();onChange(c);};palette.append(b);buttons.push([b,c]);}
 function paint(){for(const [b,c] of buttons)b.classList.toggle("selected",selected.toLowerCase()===c.toLowerCase());}
 paint();area.append(palette);const inp=el("input");inp.type="color";inp.value=safeColor(initial)||DEFAULT_THEME.accent;inp.oninput=()=>{selected=inp.value;paint();onChange(inp.value);};area.append(field("Custom color",inp));return area;
}
// Inline editors remain within the same Settings page, not separate screens.
function mountEditor(host, build){

function showSectionEditor(id,host){

   panel.append(el("div","inline-heading",section?"Edit section":"New section"));
   const name=textInput(section?.name||"","Section name");
   const fields=el("div","field-set");fields.append(field("Name",name));panel.append(fields);
   const err=el("div","error");panel.append(err);
   const actions=el("div","inline-actions");
   const cancel=el("button","inline-cancel","Cancel");cancel.type="button";cancel.onclick=()=>panel.remove();
   const done=el("button","inline-save","Save");done.type="button";done.onclick=()=>{
     const n=name.value.trim();if(!n){err.textContent="Enter a section name.";return;}
     if(section)section.name=n;
     else {const s={id:uid(),name:n,icon:"broadcast",items:[]};state.sections.push(s);if(!state.active)state.active=s.id;}
     changed("Section saved");

function showButtonEditor(id,sectionId,host){
 const found=id?findItem(id):null;const item=found?.item||null;
 mountEditor(host,panel=>{
   panel.append(el("div","inline-heading",item?"Edit button":"New button"));
   const name=textInput(item?.name||"","Displayed button name");
   const section=selectInput(state.sections.map(s=>[s.id,s.name]),found?.section.id||sectionId||state.sections[0]?.id);
   const action=selectInput([["shortcut","Run Shortcut"],["url","Open Link"]],item?.action||"shortcut");
   const target=textInput(item?.target||"","Exact Shortcut name");
   const ret=checkRow("Return to Media",!item?.noReturn);
   const fields=el("div","field-set");const targetRow=field("Shortcut",target);
   fields.append(field("Name",name),field("Section",section),field("Action",action),targetRow,ret.row);
   panel.append(fields);
   function syncAction(){const isURL=action.value==="url";targetRow.querySelector("label").textContent=isURL?"Link":"Shortcut";target.placeholder=isURL?"https://music.apple.com/...":"Exact Shortcut name";ret.row.hidden=isURL;}
   action.onchange=syncAction;syncAction();
   const err=el("div","error");panel.append(err);
   const actions=el("div","inline-actions");
   const cancel=el("button","inline-cancel","Cancel");cancel.type="button";cancel.onclick=()=>panel.remove();
   const done=el("button","inline-save","Save");done.type="button";done.onclick=()=>{
     const n=name.value.trim(),t=target.value.trim(),dest=state.sections.find(s=>s.id===section.value);
     if(!n||!t){err.textContent="Enter a button name and destination.";return;}
     if(action.value==="url"&&!/^(https?:|music:|podcasts:|spotify:|overcast:|x-apple-music:)/i.test(t)){err.textContent="Use a valid HTTPS or supported app link.";return;}
     if(!dest){err.textContent="Select an existing section.";return;}
     const next={id:item?.id||uid(),name:n,icon:item?.icon||"music",action:action.value,target:t,noReturn:action.value==="shortcut"&&!ret.input.checked,color:item?.color||""};
     if(found){const at=found.section.items.findIndex(i=>i.id===id);found.section.items.splice(at,1);if(dest===found.section)dest.items.splice(at,0,next);else dest.items.push(next);}
     else dest.items.push(next);
     changed("Button saved");
   };
   actions.append(cancel,done);panel.append(actions);
 });
}
function exportSettings(){const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});const url=URL.createObjectURL(blob);const a=el("a");a.href=url;a.download="Media-JT-Sport-Settings.json";document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);notify("Download requested");}
