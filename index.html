<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Audio" />
  <meta name="theme-color" content="#0f1115" />
  <title>Audio</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f1115;
      --tile: #1c2027;
      --tile-2: #232832;
      --text: #f5f7fa;
      --muted: #9ca3af;
      --red: #d2453f;
      --shadow: 0 10px 22px rgba(0,0,0,.34);
      --radius: 14px;
      --tile-h: 58px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      min-height: 100%;
      overflow: hidden;
      background: var(--bg);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
      color: var(--text);
      padding: max(11px, env(safe-area-inset-top)) 10px max(9px, env(safe-area-inset-bottom));
      background:
        radial-gradient(circle at 18% -10%, rgba(210,69,63,.20), transparent 34%),
        radial-gradient(circle at 92% 0%, rgba(47,143,184,.13), transparent 34%),
        linear-gradient(180deg, #171a20 0%, #0f1115 42%, #0b0d10 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .tile {
      position: relative;
      display: grid;
      place-items: center;
      width: min(100%, 220px);
      height: var(--tile-h);
      border: 1px solid rgba(255,255,255,.08);
      border-top-color: rgba(255,255,255,.22);
      border-radius: var(--radius);
      padding: 7px;
      color: var(--text);
      background:
        linear-gradient(180deg, rgba(255,255,255,.055), rgba(255,255,255,.015)),
        linear-gradient(145deg, var(--tile-2), var(--tile));
      box-shadow: var(--shadow);
      cursor: pointer;
      font: inherit;
      --accent: var(--red);
      transform: translateZ(0);
    }

    .tile::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background:
        linear-gradient(90deg, var(--accent), transparent 42%),
        radial-gradient(circle at 12% 0%, var(--accent), transparent 42%);
      opacity: .18;
      pointer-events: none;
    }

    .tile::after {
      content: "";
      position: absolute;
      left: 0;
      top: 12px;
      bottom: 12px;
      width: 3px;
      border-radius: 0 6px 6px 0;
      background: var(--accent);
      opacity: .9;
    }

    .tile:active,
    .tile.pressed {
      transform: scale(.972);
      filter: brightness(1.16);
    }

    .name {
      position: relative;
      z-index: 1;
      font-size: 17px;
      font-weight: 900;
      letter-spacing: -.025em;
      text-shadow: 0 1px 8px rgba(0,0,0,.38);
    }
  </style>
</head>
<body>
  <button type="button" class="tile" id="christian-btn">
    <div class="name">Christian</div>
  </button>

  <script>
    document.getElementById("christian-btn").addEventListener("click", function() {
      this.classList.add("pressed");
      setTimeout(() => {
        window.location.href = "music://music.apple.com/us/playlist/todays-christian/pl.fecfa8a26ea44ad581d4fe501892c8ff";
      }, 300);
    });
  </script>
</body>
</html>
